        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        merchantName:
          type: string
        requestedTier:
          $ref: "#/components/schemas/MerchantTier"
        requestedVolumeFeePercent:
          type: string
        status:
          $ref: "#/components/schemas/EnterpriseRateApprovalStatus"
        requestedByUserId:
          type: string
          format: uuid
        decidedByUserId:
          type: string
          format: uuid
          nullable: true
        decisionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
    EnterpriseRateApprovalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EnterpriseRateApproval"
    WatcherHealthStatus:
      type: string
      enum: [ok, degraded, down, unknown]
    WatcherHeartbeat:
