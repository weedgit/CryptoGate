openapi: 3.0.3
info:
  title: CryptoGate Phase 1 API
  version: 0.2.1
  description: >
    Contract freeze v0.2.1 (M2 orders + merchant matching-mode settings). Source of truth
    for apps/api, apps/payment-page, and apps/cashier-apk. Payment orders are watch-only.
    Service bills are a separate rail. Enum string values and PaymentOrder fields match
    @cryptogate/domain.
servers:
  - url: /v1
tags:
  - name: auth
  - name: orgs
  - name: orders
  - name: webhooks
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Password login; returns session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke current session
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Logged out
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session and org memberships
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/mfa/enroll:
    post:
      tags: [auth]
      operationId: enrollMfa
      summary: Start MFA enrollment (Owner / Administrator on agent and merchant accounts)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Enrollment challenge (e.g. TOTP secret + otpauth URL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollResponse"
  /auth/mfa/verify:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Verify MFA code to complete login or enrollment
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        "200":
          description: MFA accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid MFA code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs:
    get:
      tags: [orgs]
      operationId: listOrgs
      summary: List org accounts in the caller’s authorized subtree
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Org list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrgAccount"
    post:
      tags: [orgs]
      operationId: createOrg
      summary: Create org account (Platform / Agent / Merchant / Merchant site rules apply)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Org created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAccount"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}:
    get:
      tags: [orgs]
      operationId: getOrg
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Org account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAccount"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/users:
    post:
      tags: [orgs]
      operationId: inviteOrgUser
      summary: Invite user and assign role
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMembership"
        "403":
          description: Forbidden (e.g. Cashier cannot manage team)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/users/{userId}/role:
    put:
      tags: [orgs]
      operationId: assignOrgUserRole
      summary: Assign role; only Owner may add/remove Administrator and Viewer
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMembership"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/matching-mode:
    get:
      tags: [orgs]
      operationId: getMatchingModeSettings
      summary: Get merchant matching mode (default B when unset)
      description: >
        Merchant Owner, Administrator, or Viewer (and platform operators / agent
        ancestors) may read. Cashier receives 403. Only merchant and merchant_site
        orgs are valid; other org types return 400. Changing this setting does not
        rewrite open orders — mode is locked onto each order at create.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Current merchant matching mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingModeSettings"
        "400":
          description: Org is not a merchant (or merchant site)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [orgs]
      operationId: putMatchingModeSettings
      summary: Set merchant matching mode (Owner / Administrator only)
      description: >
        Labels (product): B Standard, C Amount fingerprint, D Memo tag, S Smart
        address. Cashier and Viewer receive 403. Mode D is only useful when the
        asset/network registry has memoSupported true (USDT Tron is false). Dangerous
        combinations (e.g. Mode S with Mode C) are rejected by packages/matching
        validateMatchingSettings when Andrew wires that check on save. Does not
        rewrite open orders.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMatchingModeRequest"
      responses:
        "200":
          description: Matching mode saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingModeSettings"
        "400":
          description: Invalid matchingMode or non-merchant org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (Cashier / Viewer / insufficient role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders:
    post:
      tags: [orders]
      operationId: createPaymentOrder
      summary: Create a payment order (idempotent with Idempotency-Key)
      description: >
        Merchant or Cashier creates a collection order. Matching mode is the merchant
        default at create time and is stored on the order; the request body must not
        include matchingMode. Payable amount, receive address, addressSource, hdIndex,
        and memoOrTag come from packages/matching assignOnCreate.

        Agent-account users receive 403. Cashiers may create orders but cannot set
        matching mode, settlement address, xPub, or fees (those endpoints are 403).
        Volume fee is not deducted from the on-chain payable amount.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentOrderRequest"
      responses:
        "201":
          description: Order created; matching fields locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Agent cannot create; or Cashier attempted a privileged field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Idempotency-Key reused with a different body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Asset/network not enabled or matching assign rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [orders]
      operationId: listPaymentOrders
      summary: List orders in the caller’s merchant scope
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentOrder"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Outside merchant scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}:
    get:
      tags: [orders]
      operationId: getPaymentOrder
      summary: Order status and received amount (merchant / cashier session)
      description: >
        Returns the payment order including matching fields locked at create.
        Cross-merchant access is 403. Payers must use GET /orders/{id}/payment
        (public) instead of this path.
      parameters:
        - $ref: "#/components/parameters/orderId"
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        "200":
          description: Order status and received amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Outside merchant scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}/on-chain:
    get:
      tags: [orders]
      operationId: getPaymentOrderOnChain
      parameters:
        - $ref: "#/components/parameters/orderId"
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        "200":
          description: Hash, height, addresses, amount, time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnChainDetails"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}/payment:
    get:
      tags: [orders]
      operationId: getPaymentOrderPayment
      summary: Public guest-pay payload (no merchant session)
      description: >
        Polled by apps/payment-page and cashier QR screens. No login.
        Order ids are opaque; response must not include settlement keys, xPub,
        fee rates, or merchant session data. Do not poll the chain from the
        payment page — poll this endpoint for status.

        Expired and anomaly orders still return 200 with status set so the
        guest page can render those states. Unknown id returns 404.
      parameters:
        - $ref: "#/components/parameters/orderId"
      security: []
      responses:
        "200":
          description: Payment page URL, QR payload, copy-ready address and amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDetails"
        "404":
          description: Payment link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhooks:
    post:
      tags: [webhooks]
      operationId: registerWebhook
      security:
        - sessionCookie: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        "201":
          description: Callback URL registered
  /webhooks/test:
    post:
      tags: [webhooks]
      operationId: testWebhook
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        "202":
          description: Signed sample event accepted for delivery

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cg_session
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    orderId:
      name: id
      in: path
      required: true
      schema:
        type: string
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Required on POST /orders. Reuse of the same key with the same body
        returns the original 201 body. Same key with a different body is 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    OrgType:
      type: string
      enum: [platform, agent, agent_sub, merchant, merchant_site]
    UserRole:
      type: string
      enum: [owner, administrator, viewer, cashier]
    OrderStatus:
      type: string
      enum:
        - pending_payment
        - verifying
        - confirmed
        - completed
        - expired
        - payment_anomaly
        - failed
        - cancelled
    MatchingMode:
      type: string
      description: B Standard, C Amount fingerprint, D Memo tag, S Smart address
      enum: [B, C, D, S]
    MatchingModeSettings:
      type: object
      required: [orgId, matchingMode]
      properties:
        orgId:
          type: string
          description: Merchant or merchant_site org id
        matchingMode:
          $ref: "#/components/schemas/MatchingMode"
    UpdateMatchingModeRequest:
      type: object
      required: [matchingMode]
      properties:
        matchingMode:
          $ref: "#/components/schemas/MatchingMode"
    AddressSource:
      type: string
      enum: [main, hd_pool]
    AssetCode:
      type: string
      enum: [USDT, USDC, BTC, ETH, TRX]
    NetworkId:
      type: string
      enum:
        - ethereum
        - tron
        - bnb_smart_chain
        - polygon
        - arbitrum_one
        - solana
        - ton
        - base
        - bitcoin
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal string in major units (no float)
          example: "50.01"
        currency:
          $ref: "#/components/schemas/AssetCode"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        orgId:
          type: string
          description: Optional org scope when user has multiple memberships
    LoginResponse:
      type: object
      required: [session, mfaRequired]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        mfaRequired:
          type: boolean
    MfaEnrollResponse:
      type: object
      required: [otpauthUrl, secret]
      properties:
        otpauthUrl:
          type: string
        secret:
          type: string
    MfaVerifyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 8
    Session:
      type: object
      required: [userId, email, memberships]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/OrgMembership"
    OrgAccount:
      type: object
      required: [id, type, name, parentId]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/OrgType"
        name:
          type: string
        parentId:
          type: string
          nullable: true
        structure:
          type: string
          enum: [single_location, multi_location]
          description: Merchant accounts only
    CreateOrgRequest:
      type: object
      required: [type, name, parentId]
      properties:
        type:
          $ref: "#/components/schemas/OrgType"
        name:
          type: string
        parentId:
          type: string
        structure:
          type: string
          enum: [single_location, multi_location]
    InviteUserRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
    OrgMembership:
      type: object
      required: [orgId, userId, role, orgType]
      properties:
        orgId:
          type: string
        userId:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        orgType:
          $ref: "#/components/schemas/OrgType"
    CreatePaymentOrderRequest:
      type: object
      required: [amount, asset, network, validitySeconds]
      additionalProperties: false
      description: >
        Do not send matchingMode, receiveAddress, or fee fields. Matching mode
        is the merchant default locked onto the order at create.
      properties:
        amount:
          type: string
          description: Requested amount before Mode C fingerprint adjustment
          example: "245.00"
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        validitySeconds:
          type: integer
          minimum: 60
          example: 900
        merchantMetadata:
          type: object
          additionalProperties: true
    PaymentOrder:
      type: object
      description: >
        Shared payment-order row (API camelCase). DB columns are PaymentOrderColumn
        in @cryptogate/domain. Receive address is merchant-controlled.
      required:
        - id
        - orderNumber
        - status
        - matchingMode
        - payableAmount
        - receivedAmount
        - receiveAddress
        - addressSource
        - hdIndex
        - memoOrTag
        - asset
        - network
        - expiresAt
      properties:
        id:
          type: string
        orderNumber:
          type: string
          example: "CG-2026-0042"
        status:
          $ref: "#/components/schemas/OrderStatus"
        matchingMode:
          $ref: "#/components/schemas/MatchingMode"
        payableAmount:
          $ref: "#/components/schemas/Money"
        receivedAmount:
          $ref: "#/components/schemas/Money"
          nullable: true
        receiveAddress:
          type: string
          description: Merchant-controlled; immutable after QR is issued
        addressSource:
          $ref: "#/components/schemas/AddressSource"
        hdIndex:
          type: integer
          nullable: true
          description: Set when addressSource is hd_pool (Mode S)
        memoOrTag:
          type: string
          nullable: true
          description: Set for Mode D when the network supports memos
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        expiresAt:
          type: string
          format: date-time
        createdBy:
          type: string
    PaymentDetails:
      type: object
      description: Guest pay / POS QR payload. Never includes keys, xPub, or fees.
      required:
        - orderNumber
        - status
        - merchantName
        - matchingMode
        - paymentPageUrl
        - qrPayload
        - receiveAddress
        - payableAmount
        - copyAmount
        - asset
        - network
        - expiresAt
        - wrongNetworkWarning
      properties:
        orderNumber:
          type: string
          example: "CG-2026-0042"
        status:
          $ref: "#/components/schemas/OrderStatus"
        merchantName:
          type: string
          example: "Hotel Marrakech — Casablanca"
        matchingMode:
          $ref: "#/components/schemas/MatchingMode"
        paymentPageUrl:
          type: string
          format: uri
        qrPayload:
          type: string
          description: Network URI encoded in the QR (not a chain RPC URL)
        receiveAddress:
          type: string
        payableAmount:
          $ref: "#/components/schemas/Money"
        copyAmount:
          type: string
          description: Copy-ready payable amount (major units, no asset suffix)
          example: "245.00"
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        contractAddress:
          type: string
          nullable: true
        memoOrTag:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        wrongNetworkWarning:
          type: string
          example: "Send only USDT on TRON TRC-20. Wrong network may result in lost funds."
        payExactAmountWarning:
          type: string
          nullable: true
          description: Present for Mode C fingerprint orders
        memoWarning:
          type: string
          nullable: true
          description: Present for Mode D when memoOrTag is required
    OnChainDetails:
      type: object
      properties:
        txHash:
          type: string
          nullable: true
        blockHeight:
          type: integer
          nullable: true
        fromAddress:
          type: string
          nullable: true
        toAddress:
          type: string
          nullable: true
        amount:
          $ref: "#/components/schemas/Money"
        confirmedAt:
          type: string
          format: date-time
          nullable: true
