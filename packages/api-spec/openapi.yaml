openapi: 3.0.3
info:
  title: CryptoGate Phase 1 API
  version: 0.3.3
  description: >
    Contract freeze v0.3.3 (platform fee tiers + merchant commercial settings).
    Builds on v0.3.2 audit + service bill lifecycle. Source of truth for apps/api,
    apps/payment-page, and apps/cashier-apk. Payment orders are watch-only.
    Service bills are a separate rail — never merge with /orders. Enums match
    @cryptogate/domain. Never return spend keys, full xPub, webhook signingSecret,
    or API key secret on GET.

    Machine clients (security apiKey): send X-Api-Key, X-Timestamp, X-Nonce,
    X-Signature. Canonical string is timestamp LF nonce LF METHOD LF pathAndQuery
    LF sha256Hex(rawBody); signature is hex HMAC-SHA256(apiSecret, canonical).
    Session cookie and public GET /orders/{id}/payment do not sign. Replay and
    skew codes: signature_invalid, timestamp_skew, nonce_replay (401). Rate
    limits: RateLimitPerMinute in domain; 429 rate_limited + Retry-After.
servers:
  - url: /v1
tags:
  - name: auth
  - name: orgs
  - name: orders
  - name: api-keys
  - name: webhooks
  - name: service-bills
  - name: audit
  - name: platform-settings
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Password login; returns session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Login rate limit (10/min per IP)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke current session
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Logged out
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session and org memberships
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/mfa/enroll:
    post:
      tags: [auth]
      operationId: enrollMfa
      summary: Start MFA enrollment (Owner / Administrator on agent and merchant accounts)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Enrollment challenge (e.g. TOTP secret + otpauth URL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollResponse"
  /auth/mfa/verify:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Verify MFA code to complete login or enrollment
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        "200":
          description: MFA accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid MFA code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs:
    get:
      tags: [orgs]
      operationId: listOrgs
      summary: List org accounts in the caller’s authorized subtree
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Org list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrgAccount"
    post:
      tags: [orgs]
      operationId: createOrg
      summary: Create org account (Platform / Agent / Merchant / Merchant site rules apply)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Org created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAccount"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}:
    get:
      tags: [orgs]
      operationId: getOrg
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Org account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAccount"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/users:
    post:
      tags: [orgs]
      operationId: inviteOrgUser
      summary: Invite user and assign role
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMembership"
        "403":
          description: Forbidden (e.g. Cashier cannot manage team)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/users/{userId}/role:
    put:
      tags: [orgs]
      operationId: assignOrgUserRole
      summary: Assign role; only Owner may add/remove Administrator and Viewer
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMembership"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/matching-mode:
    get:
      tags: [orgs]
      operationId: getMatchingModeSettings
      summary: Get merchant matching mode (default B when unset)
      description: >
        Merchant Owner, Administrator, or Viewer (and platform operators / agent
        ancestors) may read. Cashier receives 403. Only merchant and merchant_site
        orgs are valid; other org types return 400. Changing this setting does not
        rewrite open orders — mode is locked onto each order at create.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Current merchant matching mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingModeSettings"
        "400":
          description: Org is not a merchant (or merchant site)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [orgs]
      operationId: putMatchingModeSettings
      summary: Set merchant matching mode (Owner / Administrator only)
      description: >
        Labels (product): B Standard, C Amount fingerprint, D Memo tag, S Smart
        address. Cashier and Viewer receive 403. Mode D is only useful when the
        asset/network registry has memoSupported true (USDT Tron is false). Dangerous
        combinations (e.g. Mode S with Mode C) are rejected by packages/matching
        validateMatchingSettings when Andrew wires that check on save. Does not
        rewrite open orders.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMatchingModeRequest"
      responses:
        "200":
          description: Matching mode saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingModeSettings"
        "400":
          description: Invalid matchingMode or non-merchant org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (Cashier / Viewer / insufficient role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/settlement:
    get:
      tags: [orgs]
      operationId: listSettlementAddresses
      summary: List merchant settlement addresses (per asset/network)
      description: >
        Merchant Owner, Administrator, or Viewer (and platform operators / agent
        ancestors) may read. Cashier receives 403. Only merchant and merchant_site
        orgs are valid. Addresses are merchant-controlled receive destinations used
        by matching assignOnCreate — CryptoGate never holds spend keys.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Settlement address book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementAddressList"
        "400":
          description: Org is not a merchant (or merchant site)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [orgs]
      operationId: putSettlementAddress
      summary: Upsert settlement address for an asset/network pair
      description: >
        Owner or Administrator only (Cashier / Viewer 403). Asset+network must be
        enabled in packages/domain registry (Phase 1: USDT + tron). Upserts one
        address per (org, asset, network). Body requires mfaCode.

        First address for a pair activates immediately. Changing an existing address
        writes pendingAddress / pendingActivatesAt (default 24h, SETTLEMENT_COOLDOWN_MS)
        and keeps address as the currently active receive destination until then.
        New payment orders keep using address until cool-down ends. Audit on PUT.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSettlementAddressRequest"
      responses:
        "200":
          description: Settlement address saved (active or pending_cool_down)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementAddress"
        "400":
          description: Invalid body or non-merchant org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated or invalid MFA code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (Cashier / Viewer / MFA not enrolled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Asset/network not enabled in domain registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/xpub:
    get:
      tags: [orgs]
      operationId: listXpubSettings
      summary: List xPub registration presence (never the full xPub)
      description: >
        Merchant Owner, Administrator, or Viewer (and platform / agent ancestors)
        may read. Cashier 403. Response is presence + cool-down status only —
        never the xPub string, seed, or private key. Mode S HD assign needs an
        active (non-pending) xPub for the asset/network.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: xPub presence list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XpubSettingsList"
        "400":
          description: Org is not a merchant (or merchant site)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [orgs]
      operationId: putXpubSettings
      summary: Register or rotate watch-only xPub (MFA + cool-down)
      description: >
        Owner or Administrator only. Body requires asset, network, xPub, mfaCode.
        First xPub for a pair activates immediately. Rotation stores pendingXPub
        (GET never echoes the string) until pendingActivatesAt. Same cool-down
        default as settlement (24h / SETTLEMENT_COOLDOWN_MS). Audit on PUT.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertXpubRequest"
      responses:
        "200":
          description: xPub presence saved (active or pending_cool_down)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XpubSettings"
        "400":
          description: Invalid body or non-merchant org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated or invalid MFA code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (Cashier / Viewer / MFA not enrolled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Asset/network not enabled in domain registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/hd-pool:
    get:
      tags: [orgs]
      operationId: listHdPoolAddresses
      summary: List Mode S HD pool addresses (watch-only)
      description: >
        Same visibility bar as xPub GET (Owner/Admin/Viewer; Cashier 403). Returns
        merchant-controlled receive addresses with FREE / IN_USE / COOLDOWN status.
        Never returns xPub, derivation private keys, or seeds. Claiming a FREE slot
        or deriving a new index happens only inside POST /orders Mode S assign —
        there is no public claim endpoint.

        derivationPath is the relative template under the account xPub (e.g. 0/{index}).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: HD pool snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HdPoolList"
        "400":
          description: Org is not a merchant (or merchant site)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders:
    post:
      tags: [orders]
      operationId: createPaymentOrder
      summary: Create a payment order (idempotent with Idempotency-Key)
      description: >
        Merchant or Cashier creates a collection order. Matching mode is the merchant
        default at create time and is stored on the order; the request body must not
        include matchingMode. Payable amount, receive address, addressSource, hdIndex,
        and memoOrTag come from packages/matching assignOnCreate. Mode S same-amount
        conflicts claim or derive from the HD pool under the create lock.

        Agent-account users receive 403. Cashiers may create orders but cannot set
        matching mode, settlement address, xPub, or fees (those endpoints are 403).
        Volume fee is not deducted from the on-chain payable amount.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentOrderRequest"
      responses:
        "201":
          description: Order created; matching fields locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Agent cannot create; or Cashier attempted a privileged field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Idempotency-Key reused with a different body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Asset/network not enabled or matching assign rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit (API key 120/min or IP 300/min)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [orders]
      operationId: listPaymentOrders
      summary: List or export orders in the caller’s merchant scope
      description: >
        JSON default `{ items }`. `format=csv` (or Accept: text/csv) returns a
        spreadsheet-safe CSV. Cashier JSON is own orders only; Cashier CSV is 403.
        Merchant Owner/Admin/Viewer may list descendant merchant_site orders.
        Query orgId must be inside that tree. Platform operator lists all.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
          description: Default json. csv max 5000 rows; json max 200 (default 100).
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: orgId
          in: query
          schema:
            type: string
            format: uuid
          description: Restrict to one org in the caller’s merchant tree
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      responses:
        "200":
          description: Order list (JSON) or CSV download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrderList"
            text/csv:
              schema:
                type: string
              description: >
                Headers include matching_mode, payable_amount, receive_address,
                address_source, hd_index, memo_or_tag. Cells neutralize leading =+-@.
        "400":
          description: Invalid format, status, orgId, or limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Outside merchant scope, or Cashier attempted CSV export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}:
    get:
      tags: [orders]
      operationId: getPaymentOrder
      summary: Order status and received amount (merchant / cashier session)
      description: >
        Returns the payment order including matching fields locked at create.
        Cross-merchant access is 403. Payers must use GET /orders/{id}/payment
        (public) instead of this path.
      parameters:
        - $ref: "#/components/parameters/orderId"
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        "200":
          description: Order status and received amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Outside merchant scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}/on-chain:
    get:
      tags: [orders]
      operationId: getPaymentOrderOnChain
      summary: On-chain facts for a payment order (watcher-written)
      description: >
        Merchant/cashier session or signed API key. 200 even when no tx yet
        (txHash null). toAddress is the order receive address. Cross-merchant
        403. Guest pay page must not call this — use GET /orders/{id}/payment.
      parameters:
        - $ref: "#/components/parameters/orderId"
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        "200":
          description: Hash, height, addresses, amount, time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnChainDetails"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Outside merchant scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}/payment:
    get:
      tags: [orders]
      operationId: getPaymentOrderPayment
      summary: Public guest-pay payload (no merchant session)
      description: >
        Polled by apps/payment-page and cashier QR screens. No login.
        Order ids are opaque; response must not include settlement keys, xPub,
        fee rates, or merchant session data. Do not poll the chain from the
        payment page — poll this endpoint for status.

        Expired and anomaly orders still return 200 with status set so the
        guest page can render those states. Unknown id returns 404.
      parameters:
        - $ref: "#/components/parameters/orderId"
      security: []
      responses:
        "200":
          description: Payment page URL, QR payload, copy-ready address and amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDetails"
        "404":
          description: Payment link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Guest pay poll rate limit (60/min per IP)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api-keys:
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: List API keys for the caller merchant org (never secret)
      description: >
        Owner/Admin/Viewer. Cashier 403. Agent accounts cannot list merchant keys.
        Returns active keys only (revoked rows omitted). Never returns `secret`.
        Max active keys per merchant org: 10 (`API_KEY_MAX_PER_ORG`).
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      responses:
        "200":
          description: Active key metadata without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier / agent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [api-keys]
      operationId: createApiKey
      summary: Create a machine API key; secret shown once
      description: >
        Owner/Admin only. Cashier 403. Agent cannot create merchant keys.
        `secret` is returned once on 201 and never again — store hashed at rest;
        never log. `keyId` is the public id for `X-Api-Key` (prefix `cgk_`).
        HMAC uses `secret` as in v0.3.0. At most 10 active keys per org → 409
        when full. Audit-log create.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Key created; secret shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          description: Invalid label or expiresAt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (Cashier / Viewer / agent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Org already at API_KEY_MAX_PER_ORG active keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api-keys/{apiKeyId}:
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      summary: Revoke an API key (soft revoke)
      description: >
        Owner/Admin. Cashier 403. Sets revoked_at; HMAC with that keyId fails
        immediately. Idempotent if already revoked → 204. Audit-log revoke.
        Confirm in UI before calling (dangerous action).
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/apiKeyId"
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      responses:
        "204":
          description: Revoked (or already revoked)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found in caller org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api-keys/{apiKeyId}/rotate:
    post:
      tags: [api-keys]
      operationId: rotateApiKey
      summary: Revoke key and issue a replacement; secret shown once
      description: >
        Owner/Admin. Cashier 403. Atomically revokes `{apiKeyId}` and creates a
        new active key (same label; optional new expiresAt in body). Returns the
        new key with `secret` once — same bar as create. Old keyId stops working
        immediately. 404 if target missing or already revoked. Does not count
        against max until the old row is revoked (net active count unchanged).
        Audit-log rotate.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/apiKeyId"
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateApiKeyRequest"
      responses:
        "201":
          description: Replacement key created; secret shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: apiKeyId not active in caller org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhooks:
    get:
      tags: [webhooks]
      operationId: listWebhooks
      summary: List webhook endpoints (never signingSecret)
      description: >
        Same visibility bar as xPub GET (Owner/Admin/Viewer; Cashier 403).
        GET never returns signingSecret. Max 5 endpoints per merchant org.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      responses:
        "200":
          description: Endpoint list without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [webhooks]
      operationId: registerWebhook
      summary: Register a merchant callback URL
      description: >
        HTTPS only (http://127.0.0.1 or http://localhost allowed in non-production).
        signingSecret is returned once on 201 and never again. Cashier 403.
        Agent accounts cannot register merchant callbacks. Duplicate URL → 409.
        Merchant fulfillment must use these signed events — not browser redirect.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWebhookRequest"
      responses:
        "201":
          description: Endpoint created; signingSecret shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookCreated"
        "400":
          description: Invalid URL or events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (Cashier / agent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: URL already registered for this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhooks/test:
    post:
      tags: [webhooks]
      operationId: testWebhook
      summary: Enqueue a signed webhook.test sample
      description: >
        Delivery worker signs the payload with the endpoint secret (M3-14).
        Returns 202 when queued. Optional body webhookId; otherwise all enabled
        endpoints for the caller’s merchant org.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestWebhookRequest"
      responses:
        "202":
          description: Signed sample event accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookTestAccepted"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: webhookId not in caller org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhooks/{webhookId}:
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      summary: Disable and remove a webhook endpoint
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/webhookId"
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      responses:
        "204":
          description: Removed
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhooks/{webhookId}/deliveries:
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: Recent delivery attempts (M3-14 worker)
      description: Newest first. Retries reuse the same eventId.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/webhookId"
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Delivery log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /service-bills:
    get:
      tags: [service-bills]
      operationId: listServiceBills
      summary: List service bills (not payment orders)
      description: >
        Separate rail from /orders. USD subscription + volume fee. Cashier 403.
        Merchant Owner/Admin/Viewer — own org. Agent — subtree read-only.
        Platform Owner/Admin — any org via query orgId.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
        - name: orgId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ServiceBillStatus"
      responses:
        "200":
          description: Service bill list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceBillList"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [service-bills]
      operationId: issueServiceBill
      summary: Issue a service bill (platform only)
      description: >
        Platform Owner/Administrator only. Does not create a payment order and
        must not debit merchant settlement or payer on-chain amounts.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueServiceBillRequest"
      responses:
        "201":
          description: Bill issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceBill"
        "403":
          description: Not a platform operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /service-bills/{billId}:
    get:
      tags: [service-bills]
      operationId: getServiceBill
      summary: Service bill detail
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/billId"
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      responses:
        "200":
          description: Service bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceBill"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [service-bills]
      operationId: updateServiceBill
      summary: Mark paid, void, or adjust a service bill (platform only)
      description: >
        Platform Owner/Administrator only. mark_paid: issued or overdue → paid.
        void: issued → voided (reason required). adjust: issued or overdue —
        delta on totalAmount (reason required). Cashier 403.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/billId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceBillRequest"
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceBill"
        "403":
          description: Not a platform operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /service-bills/{billId}/checkout:
    get:
      tags: [service-bills]
      operationId: getServiceBillCheckout
      summary: Platform-billing checkout payload (not guest /orders/payment)
      description: >
        Merchant Owner/Admin session. QR/link pay the platform billing wallet.
        Must not reuse PaymentDetails or payment-page routes.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/billId"
      responses:
        "200":
          description: Checkout instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceBillCheckout"
        "403":
          description: Forbidden (Cashier / agent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /audit:
    get:
      tags: [audit]
      operationId: listAuditLog
      summary: List append-only audit events (read-only)
      description: >
        Platform operators: global filters. Agent and merchant roles: events for
        orgs in authorized subtree only. Cashier 403. No DELETE — immutable log.
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: actorUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: orgId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            $ref: "#/components/schemas/AuditAction"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Audit entries (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /platform/settings/fee-tiers:
    get:
      tags: [platform-settings]
      operationId: getFeeTierSettings
      summary: Read global Small/Mid/Enterprise tier bands
      description: >
        Platform, agent, and merchant Owner/Administrator/Viewer may read bands
        for onboard sliders and effective-rate display. Cashier 403. Volume fee is
        never deducted from payer on-chain amounts.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Global tier configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformFeeTierSettings"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [platform-settings]
      operationId: updateFeeTierSettings
      summary: Update global tier bands (Platform Owner only)
      description: >
        Changes apply to the **next billing period** only — not retroactive.
        Platform Administrator may read but not edit. Logged to audit.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlatformFeeTierSettingsRequest"
      responses:
        "200":
          description: Updated tier configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformFeeTierSettings"
        "403":
          description: Not Platform Owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /platform/settings/org-policy:
    get:
      tags: [platform-settings]
      operationId: getPlatformOrgPolicy
      summary: Read platform org policy (max agent depth)
      description: Platform Owner/Administrator/Viewer read. Agent and merchant 403.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Org policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrgPolicy"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [platform-settings]
      operationId: updatePlatformOrgPolicy
      summary: Update max agent nesting depth (Platform Owner only)
      description: >
        Phase 1 default **2** (agent → agent (sub) → merchant). Changing depth
        requires confirmation in UI; logged to audit with warning metadata.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlatformOrgPolicyRequest"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrgPolicy"
        "403":
          description: Not Platform Owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/commercial:
    get:
      tags: [orgs]
      operationId: getMerchantCommercial
      summary: Merchant commercial settings (tier + volume fee %)
      description: >
        Merchant org accounts only. Platform and agent roles may read merchants in
        authorized subtree. Merchant Owner/Administrator/Viewer read own org.
        Cashier 403.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Commercial settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantCommercialSettings"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not a merchant account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [orgs]
      operationId: updateMerchantCommercial
      summary: Assign tier and volume fee within platform band
      description: >
        Agent Owner/Administrator for merchants in subtree; Platform
        Owner/Administrator for any merchant. Rate must fall inside the tier band
        unless tier is Enterprise — then creates a pending approval (see
        /platform/enterprise-rate-approvals). Merchant roles and Cashier 403.
        Changes apply to the **next billing period** unless noted in response.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMerchantCommercialRequest"
      responses:
        "200":
          description: Updated or pending approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantCommercialSettings"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Rate outside band or invalid tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /platform/enterprise-rate-approvals:
    get:
      tags: [platform-settings]
      operationId: listEnterpriseRateApprovals
      summary: List pending Enterprise custom rate requests
      description: Platform Owner/Administrator/Viewer. Cashier 403.
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EnterpriseRateApprovalStatus"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Approval queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseRateApprovalList"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /platform/enterprise-rate-approvals/{approvalId}:
    patch:
      tags: [platform-settings]
      operationId: decideEnterpriseRateApproval
      summary: Approve or deny Enterprise custom rate (Platform Owner only)
      security:
        - sessionCookie: []
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideEnterpriseRateApprovalRequest"
      responses:
        "200":
          description: Decision recorded; merchant commercial updated on approve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseRateApproval"
        "403":
          description: Not Platform Owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cg_session
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        Machine client id. Must be paired with X-Timestamp, X-Nonce, X-Signature
        (see info description and M3-01). Session cookie callers omit all four.
  parameters:
    orderId:
      name: id
      in: path
      required: true
      schema:
        type: string
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Required on POST /orders. Reuse of the same key with the same body
        returns the original 201 body. Same key with a different body is 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    apiTimestamp:
      name: X-Timestamp
      in: header
      required: false
      description: >
        Unix seconds (UTC). Required when using X-Api-Key. Rejected when
        |now − value| > 300 (API_SIGNING_MAX_SKEW_SECONDS). Omit with session cookie.
      schema:
        type: string
        pattern: "^[0-9]{10,12}$"
    apiNonce:
      name: X-Nonce
      in: header
      required: false
      description: >
        16–64 chars [A-Za-z0-9_-]. Unique per API key for 600s
        (API_SIGNING_NONCE_TTL_SECONDS). Reuse → 401 nonce_replay.
      schema:
        type: string
        minLength: 16
        maxLength: 64
        pattern: "^[A-Za-z0-9_-]{16,64}$"
    apiSignature:
      name: X-Signature
      in: header
      required: false
      description: >
        Lowercase hex HMAC-SHA256(apiSecret, canonical). Canonical =
        timestamp LF nonce LF METHOD LF pathAndQuery LF sha256Hex(rawBody).
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
    webhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    apiKeyId:
      name: apiKeyId
      in: path
      required: true
      description: Internal UUID of the api_keys row (not the public keyId / X-Api-Key)
      schema:
        type: string
        format: uuid
    billId:
      name: billId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    OrgType:
      type: string
      enum: [platform, agent, agent_sub, merchant, merchant_site]
    UserRole:
      type: string
      enum: [owner, administrator, viewer, cashier]
    OrderStatus:
      type: string
      enum:
        - pending_payment
        - verifying
        - confirmed
        - completed
        - expired
        - payment_anomaly
        - failed
        - cancelled
    MatchingMode:
      type: string
      description: B Standard, C Amount fingerprint, D Memo tag, S Smart address
      enum: [B, C, D, S]
    MatchingModeSettings:
      type: object
      required: [orgId, matchingMode]
      properties:
        orgId:
          type: string
          description: Merchant or merchant_site org id
        matchingMode:
          $ref: "#/components/schemas/MatchingMode"
    UpdateMatchingModeRequest:
      type: object
      required: [matchingMode]
      properties:
        matchingMode:
          $ref: "#/components/schemas/MatchingMode"
    SettlementAddress:
      type: object
      required: [orgId, asset, network, address, status]
      properties:
        orgId:
          type: string
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        address:
          type: string
          description: Currently active receive address (orders still use this during cool-down)
          example: TX7s39gK1p9ZqR5mY8bV2wXn5uH4kP9qR2
        pendingAddress:
          type: string
          nullable: true
          description: Next address; ignored by assignOnCreate until pendingActivatesAt
        pendingActivatesAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, pending_cool_down]
    SettlementAddressList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SettlementAddress"
    UpsertSettlementAddressRequest:
      type: object
      required: [asset, network, address, mfaCode]
      properties:
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        address:
          type: string
          minLength: 1
          description: No whitespace
        mfaCode:
          type: string
          minLength: 6
          maxLength: 8
          description: TOTP; required on every settlement PUT
    XpubSettings:
      type: object
      required: [orgId, asset, network, xPubConfigured, pendingXPub, status]
      description: Presence only — never the xPub string
      properties:
        orgId:
          type: string
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        xPubConfigured:
          type: boolean
        pendingXPub:
          type: boolean
          description: True when a rotation is waiting on cool-down (string not returned)
        pendingActivatesAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, pending_cool_down]
    XpubSettingsList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/XpubSettings"
    UpsertXpubRequest:
      type: object
      required: [asset, network, xPub, mfaCode]
      properties:
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        xPub:
          type: string
          minLength: 20
          description: Watch-only extended public key; write-only (never echoed on GET)
        mfaCode:
          type: string
          minLength: 6
          maxLength: 8
    HdPoolState:
      type: string
      description: Mode S pool slot state (matches @cryptogate/domain HdPoolState)
      enum: [FREE, IN_USE, COOLDOWN]
    HdPoolAddress:
      type: object
      required: [id, orgId, asset, network, hdIndex, receiveAddress, status]
      description: Watch-only derived receive address — never xPub
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        hdIndex:
          type: integer
          minimum: 0
        receiveAddress:
          type: string
        status:
          $ref: "#/components/schemas/HdPoolState"
        cooldownUntil:
          type: string
          format: date-time
          nullable: true
        lastOrderId:
          type: string
          nullable: true
          description: Last order that held this address (audit)
    HdPoolList:
      type: object
      required: [derivationPath, items]
      properties:
        derivationPath:
          type: string
          description: Relative path template under the account xPub
          example: "0/{index}"
        items:
          type: array
          items:
            $ref: "#/components/schemas/HdPoolAddress"
    AddressSource:
      type: string
      enum: [main, hd_pool]
    AssetCode:
      type: string
      enum: [USDT, USDC, BTC, ETH, TRX]
    NetworkId:
      type: string
      enum:
        - ethereum
        - tron
        - bnb_smart_chain
        - polygon
        - arbitrum_one
        - solana
        - ton
        - base
        - bitcoin
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal string in major units (no float)
          example: "50.01"
        currency:
          $ref: "#/components/schemas/AssetCode"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        orgId:
          type: string
          description: Optional org scope when user has multiple memberships
    LoginResponse:
      type: object
      required: [session, mfaRequired]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        mfaRequired:
          type: boolean
    MfaEnrollResponse:
      type: object
      required: [otpauthUrl, secret]
      properties:
        otpauthUrl:
          type: string
        secret:
          type: string
    MfaVerifyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 8
    Session:
      type: object
      required: [userId, email, memberships]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/OrgMembership"
    OrgAccount:
      type: object
      required: [id, type, name, parentId]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/OrgType"
        name:
          type: string
        parentId:
          type: string
          nullable: true
        structure:
          type: string
          enum: [single_location, multi_location]
          description: Merchant accounts only
    CreateOrgRequest:
      type: object
      required: [type, name, parentId]
      properties:
        type:
          $ref: "#/components/schemas/OrgType"
        name:
          type: string
        parentId:
          type: string
        structure:
          type: string
          enum: [single_location, multi_location]
        commercial:
          $ref: "#/components/schemas/MerchantCommercialOnCreate"
          description: >
            Required when type is merchant. Agent assigns tier and volume fee
            within platform band; Enterprise custom rates may enter pending approval.
    MerchantCommercialOnCreate:
      type: object
      required: [tier, volumeFeePercent]
      additionalProperties: false
      properties:
        tier:
          $ref: "#/components/schemas/MerchantTier"
        volumeFeePercent:
          type: string
          description: Percent in major units, e.g. "2.0"
          example: "2.0"
    InviteUserRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
    OrgMembership:
      type: object
      required: [orgId, userId, role, orgType]
      properties:
        orgId:
          type: string
        userId:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        orgType:
          $ref: "#/components/schemas/OrgType"
    CreatePaymentOrderRequest:
      type: object
      required: [amount, asset, network, validitySeconds]
      additionalProperties: false
      description: >
        Do not send matchingMode, receiveAddress, or fee fields. Matching mode
        is the merchant default locked onto the order at create.
      properties:
        amount:
          type: string
          description: Requested amount before Mode C fingerprint adjustment
          example: "245.00"
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        validitySeconds:
          type: integer
          minimum: 60
          example: 900
        merchantMetadata:
          type: object
          additionalProperties: true
    PaymentOrder:
      type: object
      description: >
        Shared payment-order row (API camelCase). DB columns are PaymentOrderColumn
        in @cryptogate/domain. Receive address is merchant-controlled.
      required:
        - id
        - orderNumber
        - status
        - matchingMode
        - payableAmount
        - receivedAmount
        - receiveAddress
        - addressSource
        - hdIndex
        - memoOrTag
        - asset
        - network
        - expiresAt
      properties:
        id:
          type: string
        orderNumber:
          type: string
          example: "CG-2026-0042"
        status:
          $ref: "#/components/schemas/OrderStatus"
        matchingMode:
          $ref: "#/components/schemas/MatchingMode"
        payableAmount:
          $ref: "#/components/schemas/Money"
        receivedAmount:
          $ref: "#/components/schemas/Money"
          nullable: true
        receiveAddress:
          type: string
          description: Merchant-controlled; immutable after QR is issued
        addressSource:
          $ref: "#/components/schemas/AddressSource"
        hdIndex:
          type: integer
          nullable: true
          description: Set when addressSource is hd_pool (Mode S)
        memoOrTag:
          type: string
          nullable: true
          description: Set for Mode D when the network supports memos
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        expiresAt:
          type: string
          format: date-time
        createdBy:
          type: string
    PaymentOrderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaymentOrder"
    PaymentDetails:
      type: object
      description: Guest pay / POS QR payload. Never includes keys, xPub, or fees.
      required:
        - orderNumber
        - status
        - merchantName
        - matchingMode
        - paymentPageUrl
        - qrPayload
        - receiveAddress
        - payableAmount
        - copyAmount
        - asset
        - network
        - expiresAt
        - wrongNetworkWarning
      properties:
        orderNumber:
          type: string
          example: "CG-2026-0042"
        status:
          $ref: "#/components/schemas/OrderStatus"
        merchantName:
          type: string
          example: "Hotel Marrakech — Casablanca"
        matchingMode:
          $ref: "#/components/schemas/MatchingMode"
        paymentPageUrl:
          type: string
          format: uri
        qrPayload:
          type: string
          description: Network URI encoded in the QR (not a chain RPC URL)
        receiveAddress:
          type: string
        payableAmount:
          $ref: "#/components/schemas/Money"
        copyAmount:
          type: string
          description: Copy-ready payable amount (major units, no asset suffix)
          example: "245.00"
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        contractAddress:
          type: string
          nullable: true
        memoOrTag:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        wrongNetworkWarning:
          type: string
          example: "Send only USDT on TRON TRC-20. Wrong network may result in lost funds."
        payExactAmountWarning:
          type: string
          nullable: true
          description: Present for Mode C fingerprint orders
        memoWarning:
          type: string
          nullable: true
          description: Present for Mode D when memoOrTag is required
    OnChainDetails:
      type: object
      description: >
        Watcher-written facts (Andrew GET /orders/{id}/on-chain). Unseen tx
        fields are null; toAddress is the order receive address even before a
        match. Do not invent blockHeight, fromAddress, or confirmedAt.
      properties:
        txHash:
          type: string
          nullable: true
        blockHeight:
          type: integer
          nullable: true
        fromAddress:
          type: string
          nullable: true
        toAddress:
          type: string
          nullable: true
        amount:
          $ref: "#/components/schemas/Money"
        confirmedAt:
          type: string
          format: date-time
          nullable: true
    WebhookEventType:
      type: string
      description: Matches @cryptogate/domain WebhookEventType
      enum:
        - payment_order.created
        - payment_order.verifying
        - payment_order.completed
        - payment_order.expired
        - payment_order.payment_anomaly
        - payment_order.failed
        - webhook.test
    CreateApiKeyRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
          description: Human label in merchant portal (not the keyId)
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry; null = no expiry. Rejected if in the past.
    RotateApiKeyRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Optional new expiry for the replacement key. Omit to keep the
            previous key's expiresAt (including null).
    ApiKey:
      type: object
      required: [id, orgId, keyId, label, createdAt, lastUsedAt, expiresAt]
      description: >
        Public API key metadata — never `secret`. Matches @cryptogate/domain ApiKey.
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        keyId:
          type: string
          minLength: 8
          maxLength: 128
          description: Public id sent as X-Api-Key (prefix cgk_)
          example: cgk_live_1a2b3c4d5e6f
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ApiKey"
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              minLength: 32
              description: >
                HMAC secret shown once on create/rotate; store hashed at rest;
                never log; never return on GET
    WebhookDeliveryStatus:
      type: string
      enum: [pending, success, failed]
    RegisterWebhookRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
          description: Default all payment_order.* (not webhook.test)
    WebhookEndpoint:
      type: object
      required: [id, orgId, url, events, enabled]
      description: Public endpoint row — never signingSecret
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    WebhookEndpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
    WebhookCreated:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [signingSecret]
          properties:
            signingSecret:
              type: string
              minLength: 32
              description: Shown once on create; store hashed at rest; never log
    TestWebhookRequest:
      type: object
      properties:
        webhookId:
          type: string
          format: uuid
    WebhookTestAccepted:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer
          minimum: 0
    WebhookEvent:
      type: object
      required: [id, type, createdAt, data]
      description: Body POSTed to the merchant URL (HMAC over raw JSON bytes)
      properties:
        id:
          type: string
          format: uuid
          description: eventId — retries keep this id
        type:
          $ref: "#/components/schemas/WebhookEventType"
        createdAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          properties:
            orderId:
              type: string
            orderNumber:
              type: string
            status:
              $ref: "#/components/schemas/OrderStatus"
    WebhookDelivery:
      type: object
      required: [id, eventId, status, attempt]
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
        attempt:
          type: integer
          minimum: 1
        httpStatus:
          type: integer
          nullable: true
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
    WebhookDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
    ServiceBillStatus:
      type: string
      description: Matches @cryptogate/domain ServiceBillStatus
      enum: [issued, paid, overdue, voided]
    ServiceBill:
      type: object
      required:
        - id
        - orgId
        - periodStart
        - periodEnd
        - subscriptionAmount
        - volumeFeeAmount
        - totalAmount
        - currency
        - status
        - dueAt
      description: Platform SaaS invoice — not a payment order
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        subscriptionAmount:
          type: string
          example: "49.00"
        volumeFeeAmount:
          type: string
          example: "12.50"
        totalAmount:
          type: string
          example: "61.50"
        currency:
          type: string
          enum: [USD]
        status:
          $ref: "#/components/schemas/ServiceBillStatus"
        dueAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: Set when status is paid (v0.3.2)
        voidedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when status is voided (v0.3.2)
        lastAdjustmentReason:
          type: string
          nullable: true
          description: Most recent platform adjustment note (v0.3.2)
    ServiceBillList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceBill"
    IssueServiceBillRequest:
      type: object
      required: [orgId, periodStart, periodEnd, subscriptionAmount, volumeFeeAmount, dueAt]
      properties:
        orgId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        subscriptionAmount:
          type: string
        volumeFeeAmount:
          type: string
        dueAt:
          type: string
          format: date-time
    UpdateServiceBillRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [mark_paid, void, adjust]
          description: Matches @cryptogate/domain ServiceBillUpdateAction
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Required for void and adjust
        adjustmentAmount:
          type: string
          description: >
            USD delta applied to totalAmount when action=adjust (signed decimal
            string, e.g. "-10.00" or "5.50"). Required for adjust.
        paymentReference:
          type: string
          maxLength: 256
          description: Optional off-chain or on-chain reference when action=mark_paid
    ServiceBillCheckout:
      type: object
      required: [billId, totalAmount, currency, payTo, instructions]
      description: Not PaymentDetails; not served by apps/payment-page
      properties:
        billId:
          type: string
          format: uuid
        totalAmount:
          type: string
        currency:
          type: string
          enum: [USD]
        payTo:
          type: string
          description: Platform billing wallet or bank instructions
        qrPayload:
          type: string
          nullable: true
        instructions:
          type: string
    MerchantTier:
      type: string
      description: Matches @cryptogate/domain MerchantTier
      enum: [small, mid, enterprise]
    FeeTierBand:
      type: object
      required:
        - tier
        - subscriptionAmountUsd
        - volumeFeeMinPercent
        - volumeFeeMaxPercent
        - defaultSignupPercent
      properties:
        tier:
          $ref: "#/components/schemas/MerchantTier"
        subscriptionAmountUsd:
          type: string
          description: Monthly subscription in USD major units. Enterprise may be negotiated per contract.
          example: "49.00"
        volumeFeeMinPercent:
          type: string
          example: "1.2"
        volumeFeeMaxPercent:
          type: string
          example: "2.0"
        defaultSignupPercent:
          type: string
          description: Default rate at merchant signup (within min–max)
          example: "2.0"
        tierDescription:
          type: string
          description: Editable help text for platform UI (B8)
    PlatformFeeTierSettings:
      type: object
      required: [tiers, updatedAt]
      properties:
        tiers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/FeeTierBand"
        updatedAt:
          type: string
          format: date-time
    UpdatePlatformFeeTierSettingsRequest:
      type: object
      required: [tiers]
      additionalProperties: false
      properties:
        tiers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/FeeTierBand"
    PlatformOrgPolicy:
      type: object
      required: [maxAgentDepth]
      properties:
        maxAgentDepth:
          type: integer
          minimum: 0
          maximum: 5
          description: Phase 1 default 2
          example: 2
    UpdatePlatformOrgPolicyRequest:
      type: object
      required: [maxAgentDepth]
      additionalProperties: false
      properties:
        maxAgentDepth:
          type: integer
          minimum: 0
          maximum: 5
    MerchantCommercialSettings:
      type: object
      required:
        - orgId
        - tier
        - volumeFeePercent
        - subscriptionAmountUsd
        - bandMinPercent
        - bandMaxPercent
        - effectiveFrom
      properties:
        orgId:
          type: string
          format: uuid
        tier:
          $ref: "#/components/schemas/MerchantTier"
        volumeFeePercent:
          type: string
          description: Effective rate for current billing period
          example: "2.0"
        pendingVolumeFeePercent:
          type: string
          nullable: true
          description: Scheduled rate for next billing period when a change is queued
        subscriptionAmountUsd:
          type: string
          example: "49.00"
        bandMinPercent:
          type: string
          description: Platform band for current tier (UI slider bounds)
        bandMaxPercent:
          type: string
        effectiveFrom:
          type: string
          format: date
          description: Start of billing period this rate applies to
        enterpriseApprovalStatus:
          $ref: "#/components/schemas/EnterpriseRateApprovalStatus"
          nullable: true
          description: Set when Enterprise custom rate awaits or completed platform review
    UpdateMerchantCommercialRequest:
      type: object
      additionalProperties: false
      properties:
        tier:
          $ref: "#/components/schemas/MerchantTier"
        volumeFeePercent:
          type: string
        reason:
          type: string
          description: Optional note; logged to audit
    EnterpriseRateApprovalStatus:
      type: string
      enum: [pending, approved, denied]
    EnterpriseRateApproval:
      type: object
      required:
        - id
        - orgId
        - merchantName
        - requestedTier
        - requestedVolumeFeePercent
        - status
        - requestedByUserId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        merchantName:
          type: string
        requestedTier:
          $ref: "#/components/schemas/MerchantTier"
        requestedVolumeFeePercent:
          type: string
        status:
          $ref: "#/components/schemas/EnterpriseRateApprovalStatus"
        requestedByUserId:
          type: string
          format: uuid
        decidedByUserId:
          type: string
          format: uuid
          nullable: true
        decisionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
    EnterpriseRateApprovalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EnterpriseRateApproval"
    DecideEnterpriseRateApprovalRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, deny]
        reason:
          type: string
          description: Required when decision is deny
    AuditAction:
      type: string
      description: Matches @cryptogate/domain AuditAction
      enum:
        - login
        - logout
        - mfa_enroll
        - mfa_verify_enroll
        - mfa_verify_login
        - org_create
        - org_user_invite
        - org_user_role
        - settlement_put
        - matching_mode_put
        - xpub_put
        - webhook_register
        - webhook_delete
        - service_bill_issue
        - service_bill_mark_paid
        - service_bill_void
        - service_bill_adjust
        - api_key_create
        - api_key_revoke
        - api_key_rotate
        - fee_tier_put
        - org_policy_put
        - merchant_commercial_put
        - enterprise_rate_decide
    AuditLogEntry:
      type: object
      required: [id, action, metadata, createdAt]
      description: Append-only audit row; metadata redacted (no secrets)
      properties:
        id:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
          nullable: true
        orgId:
          type: string
          format: uuid
          nullable: true
        action:
          $ref: "#/components/schemas/AuditAction"
        metadata:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
        createdAt:
          type: string
          format: date-time
    AuditLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
