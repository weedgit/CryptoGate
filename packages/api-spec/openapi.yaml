openapi: 3.0.3
info:
  title: CryptoGate Phase 1 API
  version: 0.3.5
  description: >
    Contract freeze v0.3.5 (merchant site inherit + Owner override approval).
    Builds on v0.3.4 service bill generation. Source of truth for apps/api,
    apps/payment-page, and apps/cashier-apk. Payment orders are watch-only.
    Service bills are a separate rail — never merge with /orders. Enums match
    @cryptogate/domain. Never return spend keys, full xPub, webhook signingSecret,
    or API key secret on GET.

    Machine clients (security apiKey): send X-Api-Key, X-Timestamp, X-Nonce,
    X-Signature. Canonical string is timestamp LF nonce LF METHOD LF pathAndQuery
    LF sha256Hex(rawBody); signature is hex HMAC-SHA256(apiSecret, canonical).
    Session cookie and public GET /orders/{id}/payment do not sign. Replay and
    skew codes: signature_invalid, timestamp_skew, nonce_replay (401). Rate
    limits: RateLimitPerMinute in domain; 429 rate_limited + Retry-After.
servers:
  - url: /v1
tags:
  - name: auth
  - name: orgs
  - name: orders
  - name: api-keys
  - name: webhooks
  - name: service-bills
  - name: audit
  - name: platform-settings
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Password login; returns session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Login rate limit (10/min per IP)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request a password-reset email (always opaque success)
      description: >
        Always returns 204 unless PASSWORD_RESET_EXPOSE_LINK=true (dev), which
        may return the reset link in JSON when the email exists. Does not reveal
        whether the address is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
      responses:
        "204":
          description: Accepted (email sent or silently ignored)
        "200":
          description: Dev-only — reset link exposed
          content:
            application/json:
              schema:
                type: object
                properties:
                  resetPath:
                    type: string
                  resetUrl:
                    type: string
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Reset password with a one-time token from forgot-password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
      responses:
        "204":
          description: Password updated
        "400":
          description: Invalid request or password policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Token expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke current session
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Logged out
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session and org memberships
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: >
            Not authenticated (`unauthenticated`), or cookie present but TOTP
            step-up is incomplete (`mfa_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/profile:
    patch:
      tags: [auth]
      operationId: patchProfile
      summary: Update profile, language, MFA preference, and session timeout
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName:
                  type: string
                  nullable: true
                  maxLength: 120
                locale:
                  type: string
                  enum: [en, zh-CN, zh-TW, ja, ko, vi, th]
                timezone:
                  type: string
                  description: IANA timezone (e.g. Asia/Singapore)
                mfaEnforcement:
                  type: boolean
                  description: User preference — require TOTP enrollment for this account
                sessionTimeoutMinutes:
                  type: integer
                  enum: [15, 30, 60, 120]
                  description: User preference — sliding session TTL
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid profile fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change password while logged in (clears mustChangePassword)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              additionalProperties: false
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Not authenticated or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/mfa/enroll:
    post:
      tags: [auth]
      operationId: enrollMfa
      summary: Start MFA enrollment (Owner / Administrator on agent and merchant accounts)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Enrollment challenge (e.g. TOTP secret + otpauth URL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollResponse"
  /auth/mfa/verify:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Verify MFA code to complete login or enrollment
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        "200":
          description: MFA accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid MFA code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs:
    get:
      tags: [orgs]
      operationId: listOrgs
      summary: List org accounts in the caller’s authorized subtree
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Org list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrgAccount"
    post:
      tags: [orgs]
      operationId: createOrg
      summary: Create org account (Platform / Agent / Merchant / Merchant site rules apply)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Org created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAccount"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/overview:
    get:
      tags: [orgs]
      operationId: getOrgOverview
      summary: Org detail overview (team, audit, orders, commercial/payout)
      description: >
        One round trip for platform org detail cards. Returns team members,
        recent audit events, scoped payment orders, and merchant commercial or
        agent payout when the caller may read them.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Overview payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgOverview"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}:
    get:
      tags: [orgs]
      operationId: getOrg
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Org account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAccount"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [orgs]
      operationId: deleteOrg
      summary: Delete an empty agent, merchant, or merchant (site) account
      description: >
        Platform Owner or Administrator may delete an agent / agent_sub / merchant
        org that has no child orgs and no blocking FK dependencies. Parent merchant
        Owner or Administrator may delete an empty merchant (site) under that parent.
        Pass query `cascade=1` to delete the full subtree including members, orders,
        bills, API keys, and webhooks (deepest children first).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Has children or linked records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/delete-preview:
    get:
      tags: [orgs]
      operationId: getOrgDeletePreview
      summary: Preview cascade delete impact for an org subtree
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Delete impact summary
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/status:
    put:
      tags: [orgs]
      operationId: setOrgStatus
      summary: Pause or resume an agent or merchant account
      description: >
        Platform Owner or Administrator may pause (revoke portal access)
        or resume an agent / agent_sub / merchant org. Child orgs are not
        auto-paused.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [active, paused]
                reason:
                  type: string
                  maxLength: 500
                  description: Optional note stored in audit log when pausing
      responses:
        "200":
          description: Org status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAccount"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/users:
    get:
      tags: [orgs]
      operationId: listOrgUsers
      summary: List org members
      description: >
        Platform operators and org Owner, Administrator, or Viewer may list
        members. Cashier receives 403.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Org members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrgMember"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [orgs]
      operationId: inviteOrgUser
      summary: Invite user and assign role
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: Membership created (new users include temporaryPassword + invite link)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteOrgUserResult"
        "403":
          description: Forbidden (e.g. Cashier cannot manage team)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/users/{userId}/role:
    put:
      tags: [orgs]
      operationId: assignOrgUserRole
      summary: Assign role; only Owner may add/remove Administrator and Viewer
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMembership"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/users/{userId}/status:
    put:
      tags: [orgs]
      operationId: setOrgUserStatus
      summary: Pause or resume an org membership
      description: >
        Org Owner or Platform Owner may pause (revoke org access) or resume a
        member. Cannot pause the last active Owner or yourself. Pausing revokes
        all sessions for that user so portals reload memberships.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  $ref: "#/components/schemas/MembershipStatus"
      responses:
        "200":
          description: Membership status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMembership"
        "403":
          description: Forbidden (last owner, self, or not Owner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Membership not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/users/{userId}:
    delete:
      tags: [orgs]
      operationId: removeOrgUser
      summary: Remove member from org
      description: >
        Org Owner or Platform Owner may delete the membership row. Cannot remove
        the last active Owner or yourself. Revokes all sessions for that user.
        Re-add via invite. Does not delete the users row.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/userId"
      responses:
        "204":
          description: Membership removed
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Membership not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/matching-mode:
    get:
      tags: [orgs]
      operationId: getMatchingModeSettings
      summary: Get merchant matching mode (default B when unset)
      description: >
        Merchant Owner, Administrator, or Viewer (and platform operators / agent
        ancestors) may read. Cashier receives 403. Only merchant and merchant_site
        orgs are valid; other org types return 400. Changing this setting does not
        rewrite open orders — mode is locked onto each order at create.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Current merchant matching mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingModeSettings"
        "400":
          description: Org is not a merchant (or merchant site)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [orgs]
      operationId: putMatchingModeSettings
      summary: Set merchant matching mode (Owner / Administrator only)
      description: >
        Labels (product): B Standard, C Amount fingerprint, D Memo tag, S Smart
        address. Cashier and Viewer receive 403. Mode D is only useful when the
        asset/network registry has memoSupported true (USDT Tron is false). Dangerous
        combinations (e.g. Mode S with Mode C) are rejected by packages/matching
        validateMatchingSettings when Andrew wires that check on save. Does not
        rewrite open orders.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMatchingModeRequest"
      responses:
        "200":
          description: Matching mode saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingModeSettings"
        "400":
          description: Invalid matchingMode or non-merchant org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (Cashier / Viewer / insufficient role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/settlement:
    get:
      tags: [orgs]
      operationId: listSettlementAddresses
      summary: List merchant settlement addresses (per asset/network)
      description: >
        Merchant Owner, Administrator, or Viewer (and platform operators / agent
        ancestors) may read. Cashier receives 403. Only merchant and merchant_site
        orgs are valid. Addresses are merchant-controlled receive destinations used
        by matching assignOnCreate — CryptoGate never holds spend keys.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Settlement address book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementAddressList"
        "400":
          description: Org is not a merchant (or merchant site)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [orgs]
      operationId: putSettlementAddress
      summary: Upsert settlement address for an asset/network pair
      description: >
        Owner or Administrator only (Cashier / Viewer 403). Asset+network must be
        enabled in packages/domain registry (Phase 1: USDT + tron). Upserts one
        address per (org, asset, network). Body requires mfaCode.

        First address for a pair activates immediately. Changing an existing address
        writes pendingAddress / pendingActivatesAt (default 24h, SETTLEMENT_COOLDOWN_MS)
        and keeps address as the currently active receive destination until then.
        New payment orders keep using address until cool-down ends. Audit on PUT.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSettlementAddressRequest"
      responses:
        "200":
          description: Settlement address saved (active or pending_cool_down)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementAddress"
        "400":
          description: Invalid body or non-merchant org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated or invalid MFA code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (Cashier / Viewer / MFA not enrolled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Asset/network not enabled in domain registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/xpub:
    get:
      tags: [orgs]
      operationId: listXpubSettings
      summary: List xPub registration presence (never the full xPub)
      description: >
        Merchant Owner, Administrator, or Viewer (and platform / agent ancestors)
        may read. Cashier 403. Response is presence + cool-down status only —
        never the xPub string, seed, or private key. Mode S HD assign needs an
        active (non-pending) xPub for the asset/network.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: xPub presence list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XpubSettingsList"
        "400":
          description: Org is not a merchant (or merchant site)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [orgs]
      operationId: putXpubSettings
      summary: Register or rotate watch-only xPub (MFA + cool-down)
      description: >
        Owner or Administrator only. Body requires asset, network, xPub, mfaCode.
        First xPub for a pair activates immediately. Rotation stores pendingXPub
        (GET never echoes the string) until pendingActivatesAt. Same cool-down
        default as settlement (24h / SETTLEMENT_COOLDOWN_MS). Audit on PUT.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertXpubRequest"
      responses:
        "200":
          description: xPub presence saved (active or pending_cool_down)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XpubSettings"
        "400":
          description: Invalid body or non-merchant org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated or invalid MFA code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (Cashier / Viewer / MFA not enrolled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Asset/network not enabled in domain registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/hd-pool:
    get:
      tags: [orgs]
      operationId: listHdPoolAddresses
      summary: List Mode S HD pool addresses (watch-only)
      description: >
        Same visibility bar as xPub GET (Owner/Admin/Viewer; Cashier 403). Returns
        merchant-controlled receive addresses with FREE / IN_USE / COOLDOWN status.
        Never returns xPub, derivation private keys, or seeds. Claiming a FREE slot
        or deriving a new index happens only inside POST /orders Mode S assign —
        there is no public claim endpoint.

        derivationPath is the relative template under the account xPub (e.g. 0/{index}).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: HD pool snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HdPoolList"
        "400":
          description: Org is not a merchant (or merchant site)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found or not in caller subtree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/setting-overrides:
    get:
      tags: [orgs]
      operationId: listSiteSettingOverrides
      summary: List inherit-override requests for a merchant (site)
      description: >
        Merchant (site) defaults inherit parent merchant settlement, xPub, matching
        mode, and order retention. Site Owner/Administrator request overrides; the
        parent merchant Owner approves or denies. Cashier 403. GET xPub payloads
        never include the full xPub string.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Override history for this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettingOverrideList"
        "400":
          description: Org is not a merchant_site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Org not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [orgs]
      operationId: requestSiteSettingOverride
      summary: Request a site-level override (site Owner / Administrator)
      description: >
        Creates a pending override. Direct PUT on site settlement / xPub / matching
        mode / retention returns 403 override_required until the parent merchant
        Owner approves. Duplicate pending kind returns 409.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestSiteSettingOverride"
      responses:
        "201":
          description: Pending override created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettingOverride"
        "400":
          description: Invalid settingKind or payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Pending or already-approved override for this kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/setting-overrides/{overrideId}:
    patch:
      tags: [orgs]
      operationId: decideSiteSettingOverride
      summary: Approve or deny a site override (parent merchant Owner)
      description: >
        Approve writes the payload onto the site org (settlement/xPub still require
        mfaCode). Deny leaves inherit in place. Platform compliance uses B7, not this
        path.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
        - name: overrideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideSiteSettingOverride"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettingOverride"
        "400":
          description: Invalid decision or missing MFA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated or invalid MFA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the parent merchant Owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Pending override not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/retention:
    get:
      tags: [orgs]
      operationId: getOrgRetentionSettings
      summary: Get order-delete retention (sites inherit parent until override)
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Effective retention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgRetentionSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [orgs]
      operationId: putOrgRetentionSettings
      summary: Set order-delete retention (Owner / Administrator; site needs override)
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgRetentionRequest"
      responses:
        "200":
          description: Retention saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgRetentionSettings"
        "403":
          description: Forbidden or override_required on a site without approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders:
    post:
      tags: [orders]
      operationId: createPaymentOrder
      summary: Create a payment order (idempotent with Idempotency-Key)
      description: >
        Merchant or Cashier creates a collection order. Matching mode is the merchant
        default at create time and is stored on the order; the request body must not
        include matchingMode. Payable amount, receive address, addressSource, hdIndex,
        and memoOrTag come from packages/matching assignOnCreate. Mode S same-amount
        conflicts claim or derive from the HD pool under the create lock.

        Agent-account users receive 403. Cashiers may create orders but cannot set
        matching mode, settlement address, xPub, or fees (those endpoints are 403).
        Volume fee is not deducted from the on-chain payable amount.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentOrderRequest"
      responses:
        "201":
          description: Order created; matching fields locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Agent cannot create; or Cashier attempted a privileged field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Idempotency-Key reused with a different body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Asset/network not enabled or matching assign rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit (API key 120/min or IP 300/min)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [orders]
      operationId: listPaymentOrders
      summary: List or export orders in the caller’s merchant scope
      description: >
        JSON default `{ items }`. `format=csv` (or Accept: text/csv) returns a
        spreadsheet-safe CSV. Cashier JSON is own orders only; Cashier CSV is 403.
        Merchant Owner/Admin/Viewer may list descendant merchant_site orders.
        Query orgId must be inside that tree. Platform operator lists all.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
          description: Default json. csv max 5000 rows; json max 200 (default 100).
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: orgId
          in: query
          schema:
            type: string
            format: uuid
          description: Restrict to one org in the caller’s merchant tree
        - name: agentOrgId
          in: query
          schema:
            type: string
            format: uuid
          description: Restrict to merchant orgs in the agent subtree (platform/agent portals)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      responses:
        "200":
          description: Order list (JSON) or CSV download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrderList"
            text/csv:
              schema:
                type: string
              description: >
                Headers include matching_mode, payable_amount, receive_address,
                address_source, hd_index, memo_or_tag. Cells neutralize leading =+-@.
        "400":
          description: Invalid format, status, orgId, or limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Outside merchant scope, or Cashier attempted CSV export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}:
    get:
      tags: [orders]
      operationId: getPaymentOrder
      summary: Order status and received amount (merchant / cashier session)
      description: >
        Returns the payment order including matching fields locked at create.
        Cross-merchant access is 403. Payers must use GET /orders/{id}/payment
        (public) instead of this path.
      parameters:
        - $ref: "#/components/parameters/orderId"
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        "200":
          description: Order status and received amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Outside merchant scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}/on-chain:
    get:
      tags: [orders]
      operationId: getPaymentOrderOnChain
      summary: On-chain facts for a payment order (watcher-written)
      description: >
        Merchant/cashier session or signed API key. 200 even when no tx yet
        (txHash null). toAddress is the order receive address. Cross-merchant
        403. Guest pay page must not call this — use GET /orders/{id}/payment.
      parameters:
        - $ref: "#/components/parameters/orderId"
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        "200":
          description: Hash, height, addresses, amount, time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnChainDetails"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Outside merchant scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}/payment:
    get:
      tags: [orders]
      operationId: getPaymentOrderPayment
      summary: Public guest-pay payload (no merchant session)
      description: >
        Polled by apps/payment-page and cashier QR screens. No login.
        Order ids are opaque; response must not include settlement keys, xPub,
        fee rates, or merchant session data. Do not poll the chain from the
        payment page — poll this endpoint for status.

        Expired and anomaly orders still return 200 with status set so the
        guest page can render those states. Unknown id returns 404.
      parameters:
        - $ref: "#/components/parameters/orderId"
      security: []
      responses:
        "200":
          description: Payment page URL, QR payload, copy-ready address and amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDetails"
        "404":
          description: Payment link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Guest pay poll rate limit (60/min per IP)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api-keys:
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: List API keys for the caller merchant org (never secret)
      description: >
        Owner/Admin/Viewer. Cashier 403. Agent accounts cannot list merchant keys.
        Returns active keys only (revoked rows omitted). Never returns `secret`.
        Max active keys per merchant org: 10 (`API_KEY_MAX_PER_ORG`).
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      responses:
        "200":
          description: Active key metadata without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier / agent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [api-keys]
      operationId: createApiKey
      summary: Create a machine API key; secret shown once
      description: >
        Owner/Admin only. Cashier 403. Agent cannot create merchant keys.
        `secret` is returned once on 201 and never again — store hashed at rest;
        never log. `keyId` is the public id for `X-Api-Key` (prefix `cgk_`).
        HMAC uses `secret` as in v0.3.0. At most 10 active keys per org → 409
        when full. Audit-log create.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Key created; secret shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          description: Invalid label or expiresAt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (Cashier / Viewer / agent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Org already at API_KEY_MAX_PER_ORG active keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api-keys/{apiKeyId}:
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      summary: Revoke an API key (soft revoke)
      description: >
        Owner/Admin. Cashier 403. Sets revoked_at; HMAC with that keyId fails
        immediately. Idempotent if already revoked → 204. Audit-log revoke.
        Confirm in UI before calling (dangerous action).
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/apiKeyId"
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      responses:
        "204":
          description: Revoked (or already revoked)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found in caller org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api-keys/{apiKeyId}/rotate:
    post:
      tags: [api-keys]
      operationId: rotateApiKey
      summary: Revoke key and issue a replacement; secret shown once
      description: >
        Owner/Admin. Cashier 403. Atomically revokes `{apiKeyId}` and creates a
        new active key (same label; optional new expiresAt in body). Returns the
        new key with `secret` once — same bar as create. Old keyId stops working
        immediately. 404 if target missing or already revoked. Does not count
        against max until the old row is revoked (net active count unchanged).
        Audit-log rotate.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/apiKeyId"
        - $ref: "#/components/parameters/apiTimestamp"
        - $ref: "#/components/parameters/apiNonce"
        - $ref: "#/components/parameters/apiSignature"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateApiKeyRequest"
      responses:
        "201":
          description: Replacement key created; secret shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (e.g. Cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: apiKeyId not active in caller org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhooks:
