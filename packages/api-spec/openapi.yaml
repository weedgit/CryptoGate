                $ref: "#/components/schemas/EnterpriseRateApproval"
        "403":
          description: Not Platform Owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /platform/watcher-health:
    get:
      tags: [platform-settings]
      operationId: getWatcherHealth
      summary: Latest per-network watcher heartbeats
      description: >
        Platform Owner/Administrator/Viewer. Returns last tick summary written by
        apps/watcher (RPC mode, ingest mode, lag-adjusted health score). Empty
        items when the watcher has not yet persisted a heartbeat.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Watcher health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatcherHealthList"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /platform/orgs/{orgId}/compliance-overrides:
    get:
      tags: [platform-settings]
      operationId: listComplianceOverrides
      summary: List compliance overrides for a merchant (B7 log)
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Override history (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceOverrideList"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Merchant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /platform/orgs/{orgId}/compliance-override:
    post:
      tags: [platform-settings]
      operationId: applyComplianceOverride
      summary: Apply B7 compliance override (MFA + immutable audit)
      description: >
        Platform Owner or Administrator. Requires enrolled MFA. Override types:
        settlement_address (immediate), matching_mode, suspend_order_create,
        suspend_merchant (pauses the org). Writes compliance_overrides and audit_log.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceOverrideRequest"
      responses:
        "200":
          description: Override applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceOverrideResult"
        "401":
          description: Invalid MFA code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden or MFA not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Merchant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cg_session
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        Machine client id. Must be paired with X-Timestamp, X-Nonce, X-Signature
        (see info description and M3-01). Session cookie callers omit all four.
  parameters:
    orderId:
      name: id
      in: path
      required: true
      schema:
        type: string
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Required on POST /orders. Reuse of the same key with the same body
        returns the original 201 body. Same key with a different body is 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    apiTimestamp:
      name: X-Timestamp
      in: header
      required: false
      description: >
        Unix seconds (UTC). Required when using X-Api-Key. Rejected when
        |now − value| > 300 (API_SIGNING_MAX_SKEW_SECONDS). Omit with session cookie.
      schema:
        type: string
        pattern: "^[0-9]{10,12}$"
    apiNonce:
      name: X-Nonce
      in: header
      required: false
      description: >
        16–64 chars [A-Za-z0-9_-]. Unique per API key for 600s
        (API_SIGNING_NONCE_TTL_SECONDS). Reuse → 401 nonce_replay.
      schema:
        type: string
        minLength: 16
        maxLength: 64
        pattern: "^[A-Za-z0-9_-]{16,64}$"
    apiSignature:
      name: X-Signature
      in: header
      required: false
      description: >
        Lowercase hex HMAC-SHA256(apiSecret, canonical). Canonical =
        timestamp LF nonce LF METHOD LF pathAndQuery LF sha256Hex(rawBody).
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
    webhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    apiKeyId:
      name: apiKeyId
      in: path
      required: true
      description: Internal UUID of the api_keys row (not the public keyId / X-Api-Key)
      schema:
        type: string
        format: uuid
    billId:
      name: billId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    OrgType:
      type: string
      enum: [platform, agent, agent_sub, merchant, merchant_site]
    UserRole:
      type: string
      enum: [owner, administrator, viewer, cashier]
    MembershipStatus:
      type: string
      description: Matches @cryptogate/domain MembershipStatus
      enum: [active, paused]
    OrderStatus:
      type: string
      enum:
        - pending_payment
        - verifying
        - confirmed
        - completed
        - expired
        - payment_anomaly
        - failed
        - cancelled
    MatchingMode:
      type: string
      description: B Standard, C Amount fingerprint, D Memo tag, S Smart address
      enum: [B, C, D, S]
    MatchingModeSettings:
      type: object
      required: [orgId, matchingMode]
      properties:
        orgId:
          type: string
          description: Merchant or merchant_site org id (the requested org)
        matchingMode:
          $ref: "#/components/schemas/MatchingMode"
        underpayTolerance:
          type: string
          description: >
            Non-negative major-unit decimal string. Mode B underpay allowance;
            same-amount collisions still become Payment Anomaly.
          example: "0"
        source:
          $ref: "#/components/schemas/SettingsSource"
        parentOrgId:
          type: string
          format: uuid
          nullable: true
        effectiveOrgId:
          type: string
          format: uuid
          description: Org whose stored matching mode was returned
    SettingsSource:
      type: string
      description: >
        merchant = parent merchant account. inherit = site using parent defaults.
        override = site after parent Owner approval.
      enum: [merchant, inherit, override]
    SiteOverrideKind:
      type: string
      enum: [settlement, xpub, matching_mode, order_retention]
    SiteOverrideStatus:
      type: string
      enum: [pending, approved, denied]
    SiteSettingOverride:
      type: object
      required: [id, siteOrgId, parentOrgId, settingKind, status, payload, createdAt]
      properties:
        id:
          type: string
          format: uuid
        siteOrgId:
          type: string
          format: uuid
        parentOrgId:
          type: string
          format: uuid
        settingKind:
          $ref: "#/components/schemas/SiteOverrideKind"
        status:
          $ref: "#/components/schemas/SiteOverrideStatus"
        payload:
          type: object
          additionalProperties: true
          description: Proposed values; xPub GET shape uses xPubConfigured only
        requestedBy:
          type: string
          format: uuid
        decidedBy:
          type: string
          format: uuid
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    SiteSettingOverrideList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteSettingOverride"
    RequestSiteSettingOverride:
      type: object
      required: [settingKind, payload]
      properties:
        settingKind:
          $ref: "#/components/schemas/SiteOverrideKind"
        payload:
          type: object
          additionalProperties: true
    DecideSiteSettingOverride:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, deny]
        reason:
          type: string
          description: Required when denying
        mfaCode:
          type: string
          minLength: 6
          maxLength: 8
          description: Required when approving settlement or xPub
    OrgRetentionSettings:
      type: object
      required: [orgId, orderDeleteDays]
      properties:
        orgId:
          type: string
          format: uuid
        orderDeleteDays:
          type: integer
          minimum: 7
          maximum: 3650
        source:
          $ref: "#/components/schemas/SettingsSource"
        parentOrgId:
          type: string
          format: uuid
          nullable: true
        effectiveOrgId:
          type: string
          format: uuid
    UpdateOrgRetentionRequest:
      type: object
      required: [orderDeleteDays]
      properties:
        orderDeleteDays:
          type: integer
          minimum: 7
          maximum: 3650
    UpdateMatchingModeRequest:
      type: object
      required: [matchingMode]
      properties:
        matchingMode:
          $ref: "#/components/schemas/MatchingMode"
        underpayTolerance:
          type: string
          description: Non-negative major-unit decimal string (Mode B)
    SettlementAddress:
      type: object
      required: [orgId, asset, network, address, status]
      properties:
        orgId:
          type: string
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        address:
          type: string
          description: Currently active receive address (orders still use this during cool-down)
          example: TX7s39gK1p9ZqR5mY8bV2wXn5uH4kP9qR2
        pendingAddress:
          type: string
          nullable: true
          description: Next address; ignored by assignOnCreate until pendingActivatesAt
        pendingActivatesAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, pending_cool_down]
    SettlementAddressList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SettlementAddress"
        source:
          $ref: "#/components/schemas/SettingsSource"
        parentOrgId:
          type: string
          format: uuid
          nullable: true
        effectiveOrgId:
          type: string
          format: uuid
    AgentPayoutAddress:
      type: object
      required: [orgId, asset, network, address]
      properties:
        orgId:
          type: string
          format: uuid
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        address:
          type: string
          description: Watch-only commission payout destination (active)
        pendingAddress:
          type: string
          nullable: true
          description: Next address; ignored until pendingActivatesAt
        pendingActivatesAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
    UpdateAgentPayoutRequest:
      type: object
      required: [asset, network, address, mfaCode]
      properties:
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        address:
          type: string
          minLength: 1
          description: No whitespace
        mfaCode:
          type: string
          minLength: 6
          maxLength: 8
          description: Required to change agent payout address
    AgentCommissionSettings:
      type: object
      required: [orgId, commissionPercent, effectiveFrom]
      properties:
        orgId:
          type: string
          format: uuid
        commissionPercent:
          type: string
          description: Percent of platform fee paid to the agent (rebate)
          example: "15"
        effectiveFrom:
          type: string
          format: date
        updatedAt:
          type: string
          format: date-time
    UpdateAgentCommissionRequest:
      type: object
      required: [commissionPercent]
      properties:
        commissionPercent:
          type: string
          description: Applies immediately (0–100)
          example: "18"
    CommissionPayout:
      type: object
      required:
        - id
        - payeeOrgId
        - payeeName
        - payer
        - periodKey
        - periodLabel
        - platformFeeCollected
        - commissionPercent
        - commissionAmount
        - payoutStatus
        - paymentLink
      properties:
        id:
          type: string
        payeeOrgId:
          type: string
          format: uuid
        payeeName:
          type: string
        payer:
          type: string
          enum: [platform, agent]
        payerOrgId:
          type: string
          format: uuid
          nullable: true
        periodKey:
          type: string
        periodLabel:
          type: string
        platformFeeCollected:
          type: number
        commissionPercent:
          type: string
        commissionAmount:
          type: number
        payoutStatus:
          type: string
          enum: [ready, paid]
        payoutAddress:
          type: string
          nullable: true
        asset:
          type: string
          nullable: true
        network:
          type: string
          nullable: true
        paymentLink:
          type: string
        txRef:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    UpsertCommissionPayoutRequest:
      type: object
      required:
        - payeeOrgId
        - payeeName
        - payer
        - periodKey
        - periodLabel
        - platformFeeCollected
        - commissionPercent
        - commissionAmount
        - paymentLink
      properties:
        payeeOrgId:
          type: string
          format: uuid
        payeeName:
          type: string
        payer:
          type: string
          enum: [platform, agent]
        payerOrgId:
          type: string
          format: uuid
          nullable: true
        periodKey:
          type: string
        periodLabel:
          type: string
        platformFeeCollected:
          type: number
        commissionPercent:
          type: string
        commissionAmount:
          type: number
        payoutAddress:
          type: string
          nullable: true
        asset:
          type: string
          nullable: true
        network:
          type: string
          nullable: true
        paymentLink:
          type: string
    UpsertSettlementAddressRequest:
      type: object
      required: [asset, network, address, mfaCode]
      properties:
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        address:
          type: string
          minLength: 1
          description: No whitespace
        mfaCode:
          type: string
          minLength: 6
          maxLength: 8
          description: TOTP; required on every settlement PUT
    XpubSettings:
      type: object
      required: [orgId, asset, network, xPubConfigured, pendingXPub, status]
      description: Presence only — never the xPub string
      properties:
        orgId:
          type: string
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        xPubConfigured:
          type: boolean
        pendingXPub:
          type: boolean
          description: True when a rotation is waiting on cool-down (string not returned)
        pendingActivatesAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, pending_cool_down]
    XpubSettingsList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/XpubSettings"
        source:
          $ref: "#/components/schemas/SettingsSource"
        parentOrgId:
          type: string
          format: uuid
          nullable: true
        effectiveOrgId:
          type: string
          format: uuid
    UpsertXpubRequest:
      type: object
      required: [asset, network, xPub, mfaCode]
      properties:
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        xPub:
          type: string
          minLength: 20
          description: Watch-only extended public key; write-only (never echoed on GET)
        mfaCode:
          type: string
          minLength: 6
          maxLength: 8
    HdPoolState:
      type: string
      description: Mode S pool slot state (matches @cryptogate/domain HdPoolState)
      enum: [FREE, IN_USE, COOLDOWN]
    HdPoolAddress:
      type: object
      required: [id, orgId, asset, network, hdIndex, receiveAddress, status]
      description: Watch-only derived receive address — never xPub
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        hdIndex:
          type: integer
          minimum: 0
        receiveAddress:
          type: string
        status:
          $ref: "#/components/schemas/HdPoolState"
        cooldownUntil:
          type: string
          format: date-time
          nullable: true
        lastOrderId:
          type: string
          nullable: true
          description: Last order that held this address (audit)
    HdPoolList:
      type: object
      required: [derivationPath, items]
      properties:
        derivationPath:
          type: string
          description: Relative path template under the account xPub
          example: "0/{index}"
        items:
          type: array
          items:
            $ref: "#/components/schemas/HdPoolAddress"
        source:
          $ref: "#/components/schemas/SettingsSource"
        parentOrgId:
          type: string
          format: uuid
          nullable: true
        effectiveOrgId:
          type: string
          format: uuid
    AddressSource:
      type: string
      enum: [main, hd_pool]
    AssetCode:
      type: string
      enum: [USDT, USDC, BTC, ETH, TRX]
    NetworkId:
      type: string
      enum:
        - ethereum
        - tron
        - tron_nile
        - bnb_smart_chain
        - polygon
        - arbitrum_one
        - solana
        - ton
        - base
        - bitcoin
      description: >
        Network id for payment orders. `tron_nile` is local/staging testnet only
        (CRYPTOGATE_CHAIN_ENV=testnet); never expose in production product builds.
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal string in major units (no float)
          example: "50.01"
        currency:
          $ref: "#/components/schemas/AssetCode"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        orgId:
          type: string
          description: Optional org scope when user has multiple memberships
    LoginResponse:
      type: object
      required: [session, mfaRequired]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        mfaRequired:
          type: boolean
    MfaEnrollResponse:
      type: object
      required: [otpauthUrl, secret]
      properties:
        otpauthUrl:
          type: string
        secret:
          type: string
    MfaVerifyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 8
    Session:
      type: object
      required:
        - userId
        - email
        - memberships
        - mustChangePassword
        - mfaEnrolled
        - mfaEnforcement
        - sessionTimeoutMinutes
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
          description: Optional display name (A10)
        locale:
          type: string
          description: UI language preference (A10)
          example: en
        timezone:
          type: string
          description: IANA timezone for date display (A10)
          example: UTC
        mustChangePassword:
          type: boolean
          description: When true, portals must block until POST /auth/change-password succeeds
        mfaEnrolled:
          type: boolean
          description: >
            True when the user completed TOTP MFA enrollment. Owner and
            Administrator portals must force enrollment when false (A5).
        mfaEnforcement:
          type: boolean
          description: >
            User preference. When true, Owner/Administrator portals force TOTP
            enrollment for this account until MFA is enabled.
        sessionTimeoutMinutes:
          type: integer
          enum: [15, 30, 60, 120]
          description: User preference — sliding session TTL in minutes
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/OrgMembership"
    OrgAccount:
      type: object
      required: [id, type, name, parentId, status]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/OrgType"
        name:
          type: string
        parentId:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, paused]
          description: Operational gate for agent portal access
        orderCreateSuspended:
          type: boolean
          description: >
            When true, POST /orders is blocked by B7 suspend_order_create
            (merchant account may still be active).
        structure:
          type: string
          enum: [single_location, multi_location]
          description: Merchant accounts only
        createdAt:
          type: string
          format: date-time
          description: Org account creation time (onboard date)
        country:
          type: string
          description: Country captured at onboard
        billingEmail:
          type: string
          format: email
          description: Billing contact email captured at onboard
        legalName:
          type: string
          description: Legal entity name when different from display name
    CreateOrgRequest:
      type: object
      required: [type, name, parentId]
      properties:
        type:
          $ref: "#/components/schemas/OrgType"
        name:
          type: string
        parentId:
          type: string
        structure:
          type: string
          enum: [single_location, multi_location]
        commercial:
          $ref: "#/components/schemas/MerchantCommercialOnCreate"
          description: >
            Required when type is merchant. Agent assigns tier and volume fee
            within platform band; Enterprise custom rates may enter pending approval.
        commissionPercent:
          type: string
          description: >
            Optional when type is agent or agent_sub. Percent of platform fee
            paid to the agent (default 15). Applies immediately.
        country:
          type: string
          description: Country captured at onboard
        billingEmail:
          type: string
          format: email
          description: Billing contact email captured at onboard
        billingContact:
          type: string
          format: email
          description: Alias for billingEmail (merchant onboard forms)
        legalName:
          type: string
          description: Legal entity name when different from display name
    MerchantCommercialOnCreate:
      type: object
      required: [tier, volumeFeePercent]
      additionalProperties: false
      properties:
        tier:
          $ref: "#/components/schemas/MerchantTier"
        volumeFeePercent:
          type: string
          description: Percent in major units, e.g. "2.0"
          example: "2.0"
    InviteUserRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
    InviteOrgUserResult:
      allOf:
        - $ref: "#/components/schemas/OrgMembership"
        - type: object
          properties:
            temporaryPassword:
              type: string
              nullable: true
              description: Present once when a new user was provisioned; copy for out-of-band share
            invitePath:
              type: string
              nullable: true
              description: Relative portal path for set-password invite link
            inviteUrl:
              type: string
              format: uri
              nullable: true
            emailDelivery:
              type: object
              properties:
                status:
                  type: string
                  enum: [stubbed, sent, skipped]
                mode:
                  type: string
    OrgMembership:
      type: object
      required: [orgId, userId, role, orgType, status]
      properties:
        orgId:
          type: string
        userId:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        orgType:
          $ref: "#/components/schemas/OrgType"
        status:
          $ref: "#/components/schemas/MembershipStatus"
    OrgMember:
      allOf:
        - $ref: "#/components/schemas/OrgMembership"
        - type: object
          required: [email]
          properties:
            email:
              type: string
              format: email
            mfaEnrolled:
              type: boolean
              description: True when the user completed MFA enrollment (B15 team table).
            lastLoginAt:
              type: string
              format: date-time
              nullable: true
              description: Most recent session create time; null if never signed in.
    CreatePaymentOrderRequest:
      type: object
      required: [amount, asset, network, validitySeconds]
      additionalProperties: false
      description: >
        Do not send matchingMode, receiveAddress, or fee fields. Matching mode
        is the merchant default locked onto the order at create.
      properties:
        amount:
          type: string
          description: Requested amount before Mode C fingerprint adjustment
          example: "245.00"
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        validitySeconds:
          type: integer
          minimum: 60
          example: 900
        merchantMetadata:
          type: object
          additionalProperties: true
    PaymentOrder:
      type: object
      description: >
        Shared payment-order row (API camelCase). DB columns are PaymentOrderColumn
        in @cryptogate/domain. Receive address is merchant-controlled.
      required:
        - id
        - orgId
        - orderNumber
        - status
        - matchingMode
        - payableAmount
        - receivedAmount
        - receiveAddress
        - addressSource
        - hdIndex
        - memoOrTag
        - asset
        - network
        - expiresAt
      properties:
        id:
          type: string
        orgId:
          type: string
          description: Merchant org that owns the payment order
        orderNumber:
          type: string
          example: "CG-2026-0042"
        status:
          $ref: "#/components/schemas/OrderStatus"
        matchingMode:
          $ref: "#/components/schemas/MatchingMode"
        payableAmount:
          $ref: "#/components/schemas/Money"
        receivedAmount:
          $ref: "#/components/schemas/Money"
          nullable: true
        receiveAddress:
          type: string
          description: Merchant-controlled; immutable after QR is issued
        addressSource:
          $ref: "#/components/schemas/AddressSource"
        hdIndex:
          type: integer
          nullable: true
          description: Set when addressSource is hd_pool (Mode S)
        memoOrTag:
          type: string
          nullable: true
          description: Set for Mode D when the network supports memos
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        expiresAt:
          type: string
          format: date-time
        createdBy:
          type: string
        anomalyReason:
          type: string
          nullable: true
          description: >
            Set when status is payment_anomaly (e.g. mode_b_same_amount_collision,
            mode_b_underpay, wrong_network). Null otherwise.
    PaymentOrderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaymentOrder"
    PaymentDetails:
      type: object
      description: Guest pay / POS QR payload. Never includes keys, xPub, or fees.
      required:
        - orderNumber
        - status
        - merchantName
        - matchingMode
        - paymentPageUrl
        - qrPayload
        - receiveAddress
        - payableAmount
        - copyAmount
        - asset
        - network
        - expiresAt
        - wrongNetworkWarning
      properties:
        orderNumber:
          type: string
          example: "CG-2026-0042"
        status:
          $ref: "#/components/schemas/OrderStatus"
        merchantName:
          type: string
          example: "Hotel Marrakech — Casablanca"
        matchingMode:
          $ref: "#/components/schemas/MatchingMode"
        paymentPageUrl:
          type: string
          format: uri
        qrPayload:
          type: string
          description: Network URI encoded in the QR (not a chain RPC URL)
        receiveAddress:
          type: string
        payableAmount:
          $ref: "#/components/schemas/Money"
        copyAmount:
          type: string
          description: Copy-ready payable amount (major units, no asset suffix)
          example: "245.00"
        asset:
          $ref: "#/components/schemas/AssetCode"
        network:
          $ref: "#/components/schemas/NetworkId"
        contractAddress:
          type: string
          nullable: true
        memoOrTag:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        wrongNetworkWarning:
          type: string
          example: "Send only USDT on TRON TRC-20. Wrong network may result in lost funds."
        anomalyReason:
          type: string
          nullable: true
          description: Present when status is payment_anomaly
        payExactAmountWarning:
          type: string
          nullable: true
          description: Present for Mode C fingerprint orders
        memoWarning:
          type: string
          nullable: true
          description: Present for Mode D when memoOrTag is required
    OnChainDetails:
      type: object
      description: >
        Watcher-written facts (Andrew GET /orders/{id}/on-chain). Unseen tx
        fields are null; toAddress is the order receive address even before a
        match. Do not invent blockHeight, fromAddress, or confirmedAt.
      properties:
        txHash:
          type: string
          nullable: true
        blockHeight:
          type: integer
          nullable: true
        fromAddress:
          type: string
          nullable: true
        toAddress:
          type: string
          nullable: true
        amount:
          $ref: "#/components/schemas/Money"
        confirmedAt:
          type: string
          format: date-time
          nullable: true
    WebhookEventType:
      type: string
      description: Matches @cryptogate/domain WebhookEventType
      enum:
        - payment_order.created
        - payment_order.verifying
        - payment_order.completed
        - payment_order.expired
        - payment_order.payment_anomaly
        - payment_order.failed
        - webhook.test
    CreateApiKeyRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
          description: Human label in merchant portal (not the keyId)
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry; null = no expiry. Rejected if in the past.
    RotateApiKeyRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Optional new expiry for the replacement key. Omit to keep the
            previous key's expiresAt (including null).
    ApiKey:
      type: object
      required: [id, orgId, keyId, label, createdAt, lastUsedAt, expiresAt]
      description: >
        Public API key metadata — never `secret`. Matches @cryptogate/domain ApiKey.
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        keyId:
          type: string
          minLength: 8
          maxLength: 128
          description: Public id sent as X-Api-Key (prefix cgk_)
          example: cgk_live_1a2b3c4d5e6f
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ApiKey"
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              minLength: 32
              description: >
                HMAC secret shown once on create/rotate; store hashed at rest;
                never log; never return on GET
    WebhookDeliveryStatus:
      type: string
      enum: [pending, success, failed]
    RegisterWebhookRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
          description: Default all payment_order.* (not webhook.test)
    WebhookEndpoint:
      type: object
      required: [id, orgId, url, events, enabled]
      description: Public endpoint row — never signingSecret
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    WebhookEndpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
    WebhookCreated:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [signingSecret]
          properties:
            signingSecret:
              type: string
              minLength: 32
              description: Shown once on create; store hashed at rest; never log
    TestWebhookRequest:
      type: object
      properties:
        webhookId:
          type: string
          format: uuid
    WebhookTestAccepted:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer
          minimum: 0
    WebhookEvent:
      type: object
      required: [id, type, createdAt, data]
      description: Body POSTed to the merchant URL (HMAC over raw JSON bytes)
      properties:
        id:
          type: string
          format: uuid
          description: eventId — retries keep this id
        type:
          $ref: "#/components/schemas/WebhookEventType"
        createdAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          properties:
            orderId:
              type: string
            orderNumber:
              type: string
            status:
              $ref: "#/components/schemas/OrderStatus"
    WebhookDelivery:
      type: object
      required: [id, eventId, status, attempt]
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
        attempt:
          type: integer
          minimum: 1
        httpStatus:
          type: integer
          nullable: true
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
    WebhookDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
    ServiceBillStatus:
      type: string
      description: Matches @cryptogate/domain ServiceBillStatus
      enum: [issued, paid, overdue, voided]
    ServiceBill:
      type: object
      required:
        - id
        - orgId
        - periodStart
        - periodEnd
        - subscriptionAmount
        - volumeFeeAmount
        - totalAmount
        - currency
        - status
        - dueAt
      description: Platform SaaS invoice — not a payment order
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        subscriptionAmount:
          type: string
          example: "49.00"
        volumeFeeAmount:
          type: string
          example: "12.50"
        totalAmount:
          type: string
          example: "61.50"
        currency:
          type: string
          enum: [USD]
        status:
          $ref: "#/components/schemas/ServiceBillStatus"
        dueAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: Set when status is paid (v0.3.2)
        voidedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when status is voided (v0.3.2)
        lastAdjustmentReason:
          type: string
          nullable: true
          description: Most recent platform adjustment note (v0.3.2)
    ServiceBillList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceBill"
    IssueServiceBillRequest:
      type: object
      required: [orgId, periodStart, periodEnd, subscriptionAmount, volumeFeeAmount, dueAt]
      properties:
        orgId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        subscriptionAmount:
          type: string
        volumeFeeAmount:
          type: string
        dueAt:
          type: string
          format: date-time
    GenerateServiceBillsRequest:
      type: object
      description: Omit both dates to generate the previous UTC calendar month.
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
    GenerateServiceBillsResult:
      type: object
      required: [periodStart, periodEnd, issued, skipped]
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        issued:
          type: array
          items:
            $ref: "#/components/schemas/ServiceBill"
        skipped:
          type: array
          items:
            type: object
            required: [orgId, reason]
            properties:
              orgId:
                type: string
                format: uuid
              reason:
                type: string
                enum: [already_issued, no_commercial, no_fee_tier]
    UpdateServiceBillRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [mark_paid, void, adjust]
          description: Matches @cryptogate/domain ServiceBillUpdateAction
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Required for void and adjust
        adjustmentAmount:
          type: string
          description: >
            USD delta applied to totalAmount when action=adjust (signed decimal
            string, e.g. "-10.00" or "5.50"). Required for adjust.
        paymentReference:
          type: string
          maxLength: 256
          description: Optional off-chain or on-chain reference when action=mark_paid
    ServiceBillCheckout:
      type: object
      required: [billId, totalAmount, currency, payTo, instructions]
      description: Not PaymentDetails; not served by apps/payment-page
      properties:
        billId:
          type: string
          format: uuid
        totalAmount:
          type: string
        currency:
          type: string
          enum: [USD]
        payTo:
          type: string
          description: Platform billing wallet or bank instructions
        qrPayload:
          type: string
          nullable: true
        instructions:
          type: string
    MerchantTier:
      type: string
      description: Matches @cryptogate/domain MerchantTier
      enum: [small, mid, enterprise]
    FeeTierBand:
      type: object
      required:
        - tier
        - subscriptionAmountUsd
        - volumeFeeMinPercent
        - volumeFeeMaxPercent
        - defaultSignupPercent
      properties:
        tier:
          $ref: "#/components/schemas/MerchantTier"
        subscriptionAmountUsd:
          type: string
          description: Monthly subscription in USD major units. Enterprise may be negotiated per contract.
          example: "49.00"
        volumeFeeMinPercent:
          type: string
          example: "1.2"
        volumeFeeMaxPercent:
          type: string
          example: "2.0"
        defaultSignupPercent:
          type: string
          description: Default rate at merchant signup (within min–max)
          example: "2.0"
        tierDescription:
          type: string
          description: Editable help text for platform UI (B8)
    PlatformFeeTierSettings:
      type: object
      required: [tiers, updatedAt]
      properties:
        tiers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/FeeTierBand"
        updatedAt:
          type: string
          format: date-time
    UpdatePlatformFeeTierSettingsRequest:
      type: object
      required: [tiers]
      additionalProperties: false
      properties:
        tiers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/FeeTierBand"
    PlatformOrgPolicy:
      type: object
      required: [maxAgentDepth, mfaEnforcement, sessionTimeoutMinutes]
      properties:
        maxAgentDepth:
          type: integer
          minimum: 0
          maximum: 5
          description: Phase 1 default 2
          example: 2
        mfaEnforcement:
          type: boolean
          description: >
            When true, Owner/Administrator portals force TOTP enrollment (A5).
            Privileged actions still require enrolled MFA regardless.
        sessionTimeoutMinutes:
          type: integer
          enum: [15, 30, 60, 120]
          description: Sliding session TTL applied on login and session refresh
    UpdatePlatformOrgPolicyRequest:
      type: object
      required: [maxAgentDepth, mfaEnforcement, sessionTimeoutMinutes]
      additionalProperties: false
      properties:
        maxAgentDepth:
          type: integer
          minimum: 0
          maximum: 5
        mfaEnforcement:
          type: boolean
        sessionTimeoutMinutes:
          type: integer
          enum: [15, 30, 60, 120]
    MerchantCommercialSettings:
      type: object
      required:
        - orgId
        - tier
        - volumeFeePercent
        - subscriptionAmountUsd
        - bandMinPercent
        - bandMaxPercent
        - effectiveFrom
      properties:
        orgId:
          type: string
          format: uuid
        tier:
          $ref: "#/components/schemas/MerchantTier"
        volumeFeePercent:
          type: string
          description: Effective rate for current billing period
          example: "2.0"
        pendingVolumeFeePercent:
          type: string
          nullable: true
