services:
  postgres:
    image: postgres:16-alpine
    container_name: cryptogate-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cryptogate
      POSTGRES_PASSWORD: cryptogate
      POSTGRES_DB: cryptogate
    volumes:
      - cryptogate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptogate -d cryptogate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cryptogate_pgdata:
