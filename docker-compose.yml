services:
  postgres:
    image: postgres:16-alpine
    container_name: paymentgate-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: paymentgate
      POSTGRES_PASSWORD: paymentgate
      POSTGRES_DB: paymentgate
    volumes:
      - paymentgate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentgate -d paymentgate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paymentgate_pgdata:
