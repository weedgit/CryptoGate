# CryptoGate — api-cg / pay-cg / app-cg on boostbunny.io
# DNS A records → this VPS. TLS: /etc/cryptogate/tls/current (self-signed until Let's Encrypt).
# Do not mark these default_server — Qchat owns that.

map $http_upgrade $cg_connection_upgrade {
    default upgrade;
    ''      close;
}

# ----- HTTP: ACME + HTTPS redirect -----
server {
    listen 80;
    listen [::]:80;
    server_name api-cg.boostbunny.io pay-cg.boostbunny.io app-cg.boostbunny.io platform-cg.boostbunny.io agent-cg.boostbunny.io merchant-cg.boostbunny.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----- API (loopback Node :3000) -----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-cg.boostbunny.io;

    ssl_certificate     /etc/cryptogate/tls/current/fullchain.pem;
    ssl_certificate_key /etc/cryptogate/tls/current/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /root/CryptoGate/deploy/nginx-security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /root/CryptoGate/deploy/nginx-scanner-deny.conf;

    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    location = /metrics {
        return 404;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location = /v1/auth/login {
        limit_req zone=cg_auth burst=12 nodelay;
        limit_req_status 429;
        include /root/CryptoGate/deploy/nginx-api-proxy.inc;
    }

    location = /v1/auth/forgot-password {
        limit_req zone=cg_auth burst=8 nodelay;
        limit_req_status 429;
        include /root/CryptoGate/deploy/nginx-api-proxy.inc;
    }

    location = /v1/auth/reset-password {
        limit_req zone=cg_auth burst=8 nodelay;
        limit_req_status 429;
        include /root/CryptoGate/deploy/nginx-api-proxy.inc;
    }

    location /v1/ {
        limit_req zone=cg_api burst=40 nodelay;
        limit_req_status 429;
        include /root/CryptoGate/deploy/nginx-api-proxy.inc;
    }

    location / {
        return 404;
    }
}

# ----- Guest pay (static) -----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pay-cg.boostbunny.io;

    ssl_certificate     /etc/cryptogate/tls/current/fullchain.pem;
    ssl_certificate_key /etc/cryptogate/tls/current/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /root/CryptoGate/deploy/nginx-security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api-cg.boostbunny.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    include /root/CryptoGate/deploy/nginx-scanner-deny.conf;

    root /root/CryptoGate/apps/payment-page/public;
    index index.html;
    client_max_body_size 256k;

    location = /config.js {
        alias /etc/cryptogate/pay-config.js;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location /pay/ {
        limit_req zone=cg_pay burst=40 nodelay;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ----- Legacy app host → portal subdomains + API proxy for old bookmarks -----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app-cg.boostbunny.io;

    ssl_certificate     /etc/cryptogate/tls/current/fullchain.pem;
    ssl_certificate_key /etc/cryptogate/tls/current/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /root/CryptoGate/deploy/nginx-security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /root/CryptoGate/deploy/nginx-scanner-deny.conf;

    location = / {
        return 301 https://merchant-cg.boostbunny.io/;
    }

    location = /platform {
        return 301 https://platform-cg.boostbunny.io/;
    }

    location ^~ /platform/ {
        rewrite ^/platform(/.*)$ https://platform-cg.boostbunny.io$1 permanent;
    }

    location = /agent {
        return 301 https://agent-cg.boostbunny.io/;
    }

    location ^~ /agent/ {
        rewrite ^/agent(/.*)$ https://agent-cg.boostbunny.io$1 permanent;
    }

    location = /merchant {
        return 301 https://merchant-cg.boostbunny.io/;
    }

    location ^~ /merchant/ {
        rewrite ^/merchant(/.*)$ https://merchant-cg.boostbunny.io$1 permanent;
    }

    include /root/CryptoGate/deploy/nginx-portal-spa.inc;
}

