# Probe / leaked-file scanners: 404 without touching disk.
location ~* ^/(?:\.env(?:\..*)?|\.git(?:/.*)?|docker-compose(?:\.ya?ml)?(?:\..*)?|serverless\.ya?ml(?:\..*)?|composer\.(?:json|lock)(?:\..*)?|\.aws(?:/.*)?|phpinfo(?:\.php)?|wp-admin(?:/.*)?|wp-login\.php) {
    access_log off;
    log_not_found off;
    return 404;
}
