# CryptoGate edge rate limits (http context — /etc/nginx/conf.d/).
limit_req_zone $binary_remote_addr zone=cg_auth:10m rate=8r/m;
limit_req_zone $binary_remote_addr zone=cg_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cg_pay:10m rate=30r/s;
ssl_session_cache shared:CgSSL:10m;
ssl_session_timeout 1d;
server_tokens off;
